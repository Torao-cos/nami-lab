      const narrow = cvP.w < 640; TS = narrow ? 0.8 : 1;
      const lin = narrow ? 10 : 24, lout = narrow ? 9 : 20;
      if (lin !== G.Lin || lout !== G.Lout) { G.Lin = lin; G.Lout = lout; pathIn = makePath([{ type: 'L', x0: -G.Lin, y0: 0, x1: 0, y1: 0 }]); pathOut = makePath([{ type: 'L', x0: G.W, y0: 0, x1: G.W + G.Lout, y1: 0 }]); }
      const path2 = makeLoop(-1, st.d);
      dbg.path2L = path2.L;
      /* ===== 管の図 ===== */
      const bx0 = -G.Lin - 8, bx1 = Math.max(G.W + G.Lout + 9, G.W + 27), by0 = -(G.h + G.dMax) - 3.5, by1 = G.h + 7;
      cvP.clear();
      { const iw = Math.max(1, cvP.iw), ih = Math.max(1, cvP.ih); const sc = Math.min(iw / (bx1 - bx0), ih / (by1 - by0)); const hw = iw / sc / 2;
        cvP.setView({ x0: (bx0 + bx1) / 2 - hw, x1: (bx0 + bx1) / 2 + hw, y0: (by0 + by1) / 2 - ih / sc / 2, y1: (by0 + by1) / 2 + ih / sc / 2 }); }
      const twPx = G.tw * cvP.sx;
      const neutral = PROJ ? '#555' : '#7fa090';
      // 輪郭（投影: 黒く太く → 色の縁）
      const all = [[pathIn, neutral], [path1, C.wave1], [path2, C.wave2], [pathOut, neutral]];
      if (PROJ) all.forEach(([P]) => strokePath(P, twPx + S(7), '#000'));
      all.forEach(([P, col]) => strokePath(P, twPx + S(PROJ ? 3 : 4.5), col, PROJ ? 1 : 0.7));
      // 中の空気（疎密）: 密 ∝ cos 2π(φ0 − s/λ)
      const dens = sTot => Math.cos(TAU * (phi0 - sTot / l));
      const empty = () => 0;
      shadePath(pathIn, s => dens(s));
      shadePath(path1, tog.p1.get() ? (s => dens(G.Lin + s)) : empty);
      shadePath(path2, tog.p2.get() ? (s => dens(G.Lin + s)) : empty);
      const w1 = tog.p1.get() ? 1 : 0, w2 = tog.p2.get() ? 1 : 0;
      shadePath(pathOut, u => (w1 * dens(G.Lin + L1() + u) + w2 * dens(G.Lin + L2() + u)) / 2);
      drawSleeves();
      if (tog.mk.get()) {
        marks(pathIn, 0, phi0, 0);
        if (w1) marks(path1, G.Lin, phi0, 0);
        if (w2) marks(path2, G.Lin, phi0, 0);
        if (w1 && w2) { const c = Math.cos(Math.PI * dL() / l), al = Math.abs(c); if (al > 0.12) marks(pathOut, G.Lin + (L1() + L2()) / 2, phi0, c >= 0 ? 0 : 0.5, Math.min(0.95, al)); }
        else if (w1 || w2) marks(pathOut, G.Lin + (w1 ? L1() : L2()), phi0, 0);
      }
      // 取っ手と U 字管の表示
      const yb = slideY();
      { const gx = G.W / 2, gy = yb - G.tw / 2 - 3.2, X = cvP.px(gx), Y = cvP.py(gy), wpx = S(64), hpx = S(20);
        cvP.line(gx, yb - G.tw / 2, gx, gy, { color: C.text, width: 3 });
        g.save(); g.fillStyle = C.yellow; g.strokeStyle = PROJ ? '#000' : '#000'; g.lineWidth = S(1.5);
        g.beginPath(); if (g.roundRect) g.roundRect(X - wpx / 2, Y - hpx / 2, wpx, hpx, S(6)); else g.rect(X - wpx / 2, Y - hpx / 2, wpx, hpx); g.fill(); g.stroke(); g.restore();
        cvP.textPx('↕ 取っ手', X, Y, { color: PROJ ? '#fff' : '#000', bold: true, size: 12, bg: false });
        cvP.textPx('U 字管（スライド）', X, Y + hpx / 2 + S(11) * TS, { color: C.wave2, bold: true, size: 12 * TS });
      }
      drawRuler();
      if (tog.ar.get()) drawExtArrows();
      // ラベル
      tx('A', -2.6, 2.6, { color: C.text, bold: true, size: 16 });
      tx('B', G.W + 2.6, 2.6, { color: C.text, bold: true, size: 16 });
      cvP.dot(G.W, 0, 4, { color: C.yellow, stroke: PROJ ? '#000' : '#000' });
      tx('経路1（固定）L₁ = ' + fmt(L1(), 1) + ' cm', G.W / 2, G.h + G.tw / 2 + 2.6, { color: C.wave1, bold: true, size: 13 });
      tx('経路2 L₂ = ' + fmt(L2(), 1) + ' cm', G.W / 2, yb + G.tw / 2 + 2.6, { color: C.wave2, bold: true, size: 13 });
      // 凡例（左下）
      { const X = cvP.pad.l + S(8), Y = cvP.h - cvP.pad.b - S(64);
        [[1, '密'], [-1, '疎']].forEach(([v, lb], i) => { const c = C.shade(v); g.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; g.fillRect(X, Y + i * S(22), S(18), S(14)); g.strokeStyle = C.line; g.strokeRect(X, Y + i * S(22), S(18), S(14)); cvP.textPx(lb, X + S(24), Y + i * S(22) + S(7), { align: 'left', size: 12, color: C.text, bg: false }); });
        { const c = C.shade(1); g.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; g.fillRect(X, Y + S(44), S(18), S(14)); cvP.linePx(X + S(9), Y + S(44), X + S(9), Y + S(58), { color: PROJ ? '#000' : '#fff', width: 2.2 }); cvP.textPx('＝ 密の位置', X + S(24), Y + S(51), { align: 'left', size: 12, color: C.text, bg: false }); }
      }

      /* ===== B での y-t（記録計） ===== */
      const Tms = 1000 / st.f, tau = phi0 * Tms, span = 3 * Tms;
      const x0 = Math.floor(tau / span) * span;
      cvR.clear(); cvR.setView({ x0, x1: x0 + span, y0: -2.5, y1: 2.5 });
      cvR.axes({ xLabel: 't [ms]', yLabel: 'y', yStep: 1, xTicks: false, yTick: y => ({ '-2': '−2a', '-1': '−a', '1': 'a', '2': '2a' })[fmt(y, 0)] || '0' });
      const ph1 = (G.Lin + L1()) / l, ph2 = (G.Lin + L2()) / l;
      const y1 = tt => w1 * Math.sin(TAU * (tt / Tms - ph1)), y2 = tt => w2 * Math.sin(TAU * (tt / Tms - ph2));
      cvR.clip(() => {
        // 前のページの記録（定常状態なので同じ形）を薄く残す＝ペンがまだ通っていない部分
        cvR.plot(tt => y1(tt) + y2(tt), { color: C.wave, width: 3, x0: tau, x1: x0 + span, alpha: PROJ ? 0.3 : 0.22 });
        if (w1) cvR.plot(y1, { color: C.wave1, width: 1.8, dash: [7, 4], x0: tau, x1: x0 + span, alpha: PROJ ? 0.3 : 0.22 });
        if (w2) cvR.plot(y2, { color: C.wave2, width: 1.8, dash: [7, 4], x0: tau, x1: x0 + span, alpha: PROJ ? 0.3 : 0.22 });
        cvR.plot(tt => y1(tt) + y2(tt), { color: C.wave, width: 4, x0, x1: tau });
        if (w1) cvR.plot(y1, { color: C.wave1, width: 2.2, dash: [7, 4], x0, x1: tau });
        if (w2) cvR.plot(y2, { color: C.wave2, width: 2.2, dash: [7, 4], x0, x1: tau });
      });
      { const xs = niceStep(span, cvR.w < 500 ? 4 : 6), dg = Math.max(0, -Math.floor(Math.log10(xs) + 1e-9));
        for (let x = Math.ceil(x0 / xs - 1e-9) * xs; x <= x0 + span + 1e-9; x += xs) cvR.textPx(fmt(x, dg), cvR.px(x), cvR.h - cvR.pad.b + S(4), { baseline: 'top', size: 11, color: C.muted, bg: false, rich: false }); }
      cvR.dot(tau, y1(tau) + y2(tau), 5, { color: C.wave, stroke: '#000' });
      cvR.textPx('B での合成の振幅 = ' + fmt(w1 && w2 ? 2 * ratio() : (w1 || w2 ? 1 : 0), 2) + 'a', cvR.pad.l + S(6), cvR.h - cvR.pad.b - S(12), { align: 'left', size: 12, color: C.wave, bold: true });

      /* ===== 振幅 − d ===== */
      cvA.clear(); cvA.setView({ x0: 0, x1: G.dMax, y0: 0, y1: 1.12 });
      cvA.axes({ xLabel: 'd [cm]', yLabel: '振幅（2a を 1）', xStep: 5, yStep: 0.2 });
      cvA.clip(() => {
        let run = [];
        const flush = () => { if (run.length > 1) cvA.plotPts(run, { color: C.wave, width: 2.6 }); else if (run.length === 1) cvA.dot(run[0].x, run[0].y, 2.5, { color: C.wave }); run = []; };
        for (let i = 0; i <= NB; i++) { const v = rec[i]; if (isNaN(v)) flush(); else run.push({ x: i * 0.1, y: v }); }
        flush();
        cvA.line(st.d, 0, st.d, 1.12, { color: C.yellow, width: 1.2, dash: [4, 4], alpha: 0.8 });
      });
      cvA.dot(st.d, ratio(), 5.5, { color: C.yellow, stroke: '#000' });
    }
  };
}

const dbg = (window.__qk = {
  st, G, lam, L1, L2, dL, ratio,
  setD: x => { window.__qk._setD(x); },
  setF: x => { window.__qk._setF(x); },
  recCount: () => { let n = 0; for (const v of rec) if (!isNaN(v)) n++; return n; },
  snd
});

document.addEventListener('visibilitychange', () => { if (document.hidden && snd.on) { sndStop(); syncSoundToggle(); } });
window.addEventListener('pagehide', () => sndStop());
function syncSoundToggle() { document.querySelectorAll('.controls label').forEach(l => { if (l.textContent.includes('音を鳴らす')) l.querySelector('input').checked = snd.on; }); }

return { build: buildQuincke, period: () => st.Tanim, stopSound: () => { if (snd.on) { sndStop(); syncSoundToggle(); } } };
})();

function tabPeriod() { return (this.api && this.api.period) ? this.api.period() : 2; }
Nami.init({
  title: 'E 応用（ホイヘンスの原理）',
  tabs: [
    { id: 'huygens', label: '13 素元波', period: tabPeriod, build: buildHuygens },
    { id: 'reflect', label: '14 反射', period: tabPeriod, build: buildReflect },
    { id: 'refract', label: '15 屈折', scrub: false, period: tabPeriod, build: buildRefract },
    { id: 'refract2', label: '16 屈折の作図と全反射', period: tabPeriod, build: buildRefract2 },
    { id: 'diffract', label: '17 回折（波動タンク）', scrub: false, period: tabPeriod, build: buildDiffract },
    { id: 'interfere', label: '18 干渉', period: tabPeriod, build: buildInterfere },
    { id: 'quincke', label: '19 音の干渉（クインケ管）', period: QK.period, build: QK.build }
  ]
});
/* クインケ管の音は、ほかのタブへ移ったら止める */
function qkGuard() { const t = Nami.app.active; if (t && t.id !== 'quincke') QK.stopSound(); }
document.querySelector('nav.tabs').addEventListener('click', qkGuard);
window.addEventListener('hashchange', qkGuard);
})();
</script></body></html>
