<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>C 縦波 - なみラボ</title>
<link rel="stylesheet" href="common.css">
<style>
  /* このページだけの局所補正（common.css は編集しない） */
  .stage.rows4{flex:1}
  .stage.rows4{grid-template-rows:0.9fr 1fr 1.45fr 1fr}
  .stage.rows4 .panel{min-height:0}
  .stage.rows4 .panel canvas{min-height:86px}
  .stage.rows2{flex:1}
  .stage.rows2 .panel{min-height:190px}
  /* 7 地震: 地球の図を主役にする。操作子は ctx.layout('side') で右列へ寄せてあるので、
     図のパネルは正方形に近い形で縦いっぱいに広げる（v(r) グラフを出したときだけ横2枚に戻す）。 */
  .view.side{--earthH:min(66vh,780px)}
  .stage.earth,.view.side .stage.earth{flex:1;min-height:var(--earthH,520px)}
  .view.side .controls:not(.detail){max-height:var(--earthH)}   /* 右列が伸びて図を押し出さないように（中はスクロール） */
  .stage.earth .panel{min-height:0}
  .stage.earth:not(.cols2) .panel{justify-self:center;width:auto;height:100%;aspect-ratio:1/1;max-width:100%}
  .panel .overlay{top:auto;bottom:.4rem;right:.6rem}
  .controls .tag{color:var(--muted);font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:.1rem .4rem}
  .controls .bigread{font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums;font-size:1.05rem}
  @media (max-width:760px){
    .view.side{--earthH:min(62vh,520px)}
    .view.side .controls:not(.detail){max-height:none}
    .stage.earth:not(.cols2) .panel{width:100%;height:100%;aspect-ratio:auto}
    .stage.rows4 .panel canvas{min-height:74px}
  }
  /* 投影モード（白地・文字118%・線と文字1.6倍）の局所補正。dark 表示には一切かけない。
     文字が大きくなるぶん、4段のタブ8では枠まわりを削って描画面の高さを確保する。 */
  html[data-mode=proj] .view{padding:.4rem;gap:.4rem}
  /* 見出しが1行に収まる幅のときだけ枠を詰める（狭い画面では見出しが2〜3行になり、
     注記の位置を上げると見出しに重なるので、共通の既定のままにする） */
  @media (min-width:761px){
    html[data-mode=proj] .stage.rows4{grid-template-rows:1.2fr 0.95fr 1.1fr 1.05fr}
    html[data-mode=proj] .stage.rows4 .panelTitle{padding:.12rem .5rem;font-size:.92rem;line-height:1.25}
    html[data-mode=proj] .stage.rows4 .panel canvas{min-height:78px}
    html[data-mode=proj] .panel .overlayTL{font-size:.72rem;top:1.65rem}
    html[data-mode=proj] .stage.rows4 .panel .overlay{font-size:.95rem}
    /* 地球の図：左上の注記は中央上の「震源」の点に重ねたくないので、左半分で折り返させる */
    html[data-mode=proj] .stage.earth .panel .overlayTL{font-size:.74rem;max-width:40%;line-height:1.3}
  }
</style>
</head><body>
<script src="common.js"></script>
<script>
(() => {
'use strict';
const { C, TAU, ui, Wave, fmt, clamp, hexA, mathHTML } = Nami;
const PROJ = Nami.PROJ, SC = Nami.SC;
// 疎のラベル色（密＝紫と対にする）。投影モードは白地なので、うすい水色では消える → 濃い青緑にする
const SPARSE = PROJ ? '#00695c' : '#cfd8ff';
const EDGE   = PROJ ? '#0d3b1e' : '#04140b';   // 玉のふちの色
const ga = a => PROJ ? Math.min(1, a * 1.9) : a;   // 白地では薄い線が飛ぶので、投影モードだけ濃くする
// 水平ブラケットのラベル。common.js は線から 12px しか離さないので、投影モードの大きい文字だと
// 線の上に乗ってしまう。上側に出すラベルだけ、ここで少し離して描き直す。
// 描くのは cv.clip() の外（＝上の余白にはみ出してよい）ので、いったんためてから flushBrackets() で出す。
const _brLabels = [];
function bracketH(cv, x1, x2, y, label, o) {
  o = o || {};
  cv.hbracket(x1, x2, y, PROJ ? null : label, o);
  if (!PROJ) return;
  // 上に出すラベルは線から十分はなす。下に出すラベル（変位）は x軸の目もりとぶつかるので、線の右へ逃がす。
  _brLabels.push(o.below
    ? { cv, label, X: cv.px(x2) + 10, Y: cv.py(y), o, align: 'left' }
    : { cv, label, X: (cv.px(x1) + cv.px(x2)) / 2, Y: cv.py(y) - 18, o, align: 'center' });
}
function flushBrackets() {
  for (const b of _brLabels) b.cv.textPx(b.label, b.X, b.Y, { color: b.o.color || C.yellow, bold: true, size: b.o.size || 14, align: b.align });
  _brLabels.length = 0;
}

/* ===================================================================
 *  共有パラメータ（タブ6と8で共通。タブ切替時に onShow で再同期）
 * =================================================================== */
const S = { lambda: 2.0, T: 2.0, A: 0.30 };
const X0 = 0, X1 = 8.0;                       // 玉列の x 範囲 [m]
const ampMax = () => 0.95 * S.lambda / TAU;   // 玉が追い越さない上限（dξ/dx > -1）

// 縦波の変位 ξ(x,t) = A sin 2π(t/T − x/λ)   右向きが正
const xi   = (x, t) => S.A * Math.sin(TAU * (t / S.T - x / S.lambda));
const vxi  = (x, t) => S.A * (TAU / S.T) * Math.cos(TAU * (t / S.T - x / S.lambda));
const dxi  = (x, t) => -S.A * (TAU / S.lambda) * Math.cos(TAU * (t / S.T - x / S.lambda)); // ∂ξ/∂x
// 位相 φ = 2π(t/T − x/λ) が φ = 2πn となる x が「密」（ξ が +→− に零交差・∂ξ/∂x 最小）
//                        φ = π+2πn となる x が「疎」
function combX(t, off) {              // x = λ(t/T − off − n) のうち [X0,X1] にあるもの
  const xs = S.lambda * (t / S.T - off), out = [];
  const n0 = Math.ceil((xs - X1) / S.lambda), n1 = Math.floor((xs - X0) / S.lambda);
  for (let n = n0; n <= n1; n++) out.push(xs - n * S.lambda);
  return out.sort((a, b) => a - b);
}
const denseX = t => combX(t, 0);      // 密
const rareX  = t => combX(t, 0.5);    // 疎

function ballXs(N) { const a = []; for (let i = 0; i < N; i++) a.push(X0 + (X1 - X0) * i / (N - 1)); return a; }

// 密と疎は λ/2 ごとに交互に並ぶ。そのすきまに n 文字（1文字 size px）の添え書きが収まるか。
// 投影モードは文字が 1.6 倍で重なりやすいのでここで間引く（dark は従来どおり必ず出す）。
const fits = (cv, n, size) => !PROJ || Math.abs(cv.px(S.lambda) - cv.px(0)) / 2 > n * size * SC * 1.05;

// 密・疎の位置をはさむ「両どなり」の玉の番号。
// 密ではこの2つの玉が向かい合う向きにずれている（＝両側から寄ってくるから混みあう）、疎では逆に離れていく。
function flankPairs(xs, pos) {
  const out = [], h = xs.length > 1 ? (xs[1] - xs[0]) : 0;
  for (const x of pos) {
    // 密・疎の位置にちょうど玉が重なると、その玉の変位は 0 で向きが見えない。
    // そこで「その位置から半玉ぶん以上はなれた、いちばん近い玉」を左右それぞれで選ぶ。
    let L = -1, R = -1;
    for (let i = 0; i < xs.length; i++) { if (xs[i] < x - h * 0.25) L = i; else if (R < 0 && xs[i] > x + h * 0.25) R = i; }
    if (L >= 0 && R >= 0) out.push([L, R]);
  }
  return out;
}
function flankMarks(xs, t, on) {
  const m = new Map();
  if (!on) return m;
  for (const [i, j] of flankPairs(xs, rareX(t)))  { m.set(i, 'r'); m.set(j, 'r'); }
  for (const [i, j] of flankPairs(xs, denseX(t))) { m.set(i, 'd'); m.set(j, 'd'); }   // 重なったら密を優先
  return m;
}

/* λ・T・A スライダー（3タブで共通に作る） */
function paramControls(parent, onChange) {
  const sL = ui.slider(parent, { label: '波長 λ', min: 1, max: 4, step: 0.1, value: S.lambda, unit: 'm', digits: 1,
    onInput: v => { S.lambda = v; sA.el.max = ampMax(); if (S.A > ampMax()) { S.A = ampMax(); sA.set(S.A, true); } onChange(); } });
  const sT = ui.slider(parent, { label: '周期 T', min: 0.5, max: 4, step: 0.1, value: S.T, unit: 's', digits: 1,
    onInput: v => { S.T = v; onChange(); } });
  const sA = ui.slider(parent, { label: '振幅 A', min: 0.02, max: ampMax(), step: 0.01, value: S.A, unit: 'm', digits: 2,
    onInput: v => { S.A = v; onChange(); } });
  sA.box.title = '玉どうしが追い越さない上限 λ/2π まで';
  return { sync() { sL.set(S.lambda, true); sT.set(S.T, true); sA.el.max = ampMax(); sA.set(S.A, true); } };
}

/* ===================================================================
 *  タブ6  縦波と横波
 * =================================================================== */
function buildLT(ctx) {
  let mode = 'both', showVel = false, showTrail = true, showEq = true,
      showLabels = true, showLam = true, N = 41;
  ctx.layout('1'); ctx.stage.classList.add('rows2');

  const cvT = ctx.canvas({ title: '横波（玉は上下にふるえる）' });
  const cvL = ctx.canvas({ title: '縦波（玉は左右にふるえる）＝疎密ができる' });
  const applyMode = () => {
    cvT.box.hidden = (mode === 'long'); cvL.box.hidden = (mode === 'trans');
    ctx.stage.style.gridTemplateRows = (mode === 'both') ? '1fr 1fr' : '1fr';
  };

  ui.select(ctx.controls, { label: '表示', value: mode, options: [['trans', '横波'], ['long', '縦波'], ['both', '両方同時']],
    onChange: v => { mode = v; applyMode(); } });
  ui.sep(ctx.controls);
  const P = paramControls(ctx.controls, () => {});
  ui.sep(ctx.controls);
  ui.toggle(ctx.controls, { label: '媒質の速度矢印', checked: showVel, onChange: v => showVel = v });
  ui.toggle(ctx.controls, { label: '疎・密ラベル', checked: showLabels, onChange: v => showLabels = v });
  ui.toggle(ctx.controls, { label: 'λ ブラケット（黄色の●をドラッグで起点の山・密を選べる）', checked: showLam,
    onChange: v => { showLam = v; hT.hidden = !v; hL.hidden = !v; } });
  ui.note(ctx.controls, '黄色い玉に注目：時間がたっても右へは進まない。進むのは「振動のようす」だけ。');
  ui.note(ctx.controls, '「密」と書いてある所では、左どなりの玉が右へ、右どなりの玉が左へずれている（紫の矢印＝つり合いの位置からのずれ）。両側から玉が寄ってくるから混みあう。「疎」はその逆。ラベルは規則で貼っているのではなく、この2本の矢印の向きがそのまま理由。');

  ui.toggle(ctx.detail, { label: '注目した玉の軌跡（振動の範囲）', checked: showTrail, onChange: v => showTrail = v });
  ui.toggle(ctx.detail, { label: 'つり合いの位置の目印', checked: showEq, onChange: v => showEq = v });
  ui.slider(ctx.detail, { label: '玉の数 N', min: 21, max: 81, step: 2, value: N, digits: 0, onInput: v => N = Math.round(v) });
  ui.note(ctx.detail, '振幅 A の上限は λ/2π。これを超えると玉が隣を追い越してしまい、媒質として成り立たない。');

  applyMode();

  /* --- λ ブラケットの起点（基準位相）---
     山（密）は x = λ(t/T − off) − kλ（k は整数＝何番目の山か）。
     k を状態として持つので、波が進むとブラケットはその山に追随して動く。
     ドラッグでは x から最寄りの k を選び直す＝別の山（密）へ起点を移せる。 */
  let lastT = 0, kT = 0, kL = 0;
  const LAM_YT = () => S.A * 1.75, LAM_YL = () => BY + 0.75;
  function lamAt(t, off, k) {                 // 画面からはみ出したら隣の山へ送る（端で折り返す）
    const room = (X1 - X0) - S.lambda;
    let x = S.lambda * (t / S.T - off) - k * S.lambda;
    if (room <= 0) return { k, x: X0 };
    let g = 0;
    while (x > X1 - S.lambda + 1e-9 && g++ < 999) { k += 1; x -= S.lambda; }
    while (x < X0 - 1e-9 && g++ < 999) { k -= 1; x += S.lambda; }
    return { k, x };
  }
  const nearestK = (t, off, x) => Math.round((S.lambda * (t / S.T - off) - x) / S.lambda);
  const hT = cvT.addHandle({ color: C.yellow, size: 6.5, r: 18,
    get: () => ({ x: lamAt(lastT, 0.25, kT).x, y: LAM_YT() }),
    set: x => { kT = nearestK(lastT, 0.25, x); } });
  const hL = cvL.addHandle({ color: C.yellow, size: 6.5, r: 18,
    get: () => ({ x: lamAt(lastT, 0, kL).x, y: LAM_YL() }),
    set: x => { kL = nearestK(lastT, 0, x); } });
  hT.hidden = hL.hidden = !showLam;

  /* --- 横波の描画 --- */
  function drawTrans(t) {
    const cv = cvT, A = S.A, yM = Math.max(A * 2.3, 0.2);
    cv.clear(); cv.setView({ x0: X0 - 0.45, x1: X1 + 0.45, y0: -yM, y1: yM });
    cv.axes({ xLabel: 'x [m]', yLabel: 'y [m]', xStep: 1, yStep: A >= 0.2 ? 0.1 : 0.05 });
    const y = x => A * Math.sin(TAU * (t / S.T - x / S.lambda));
    cv.clip(() => {
      cv.plot(y, { color: C.wave, width: 2, alpha: 0.35, x0: X0, x1: X1 });
      const xs = ballXs(N), ci = Math.round((N - 1) / 2);
      if (showEq) for (const x of xs) cv.dot(x, 0, 1.5, { color: C.muted, alpha: 0.5 });
      if (showTrail) { cv.line(xs[ci], -A, xs[ci], A, { color: C.yellow, width: 1.2, alpha: 0.35, dash: [3, 3] }); cv.dot(xs[ci], 0, 2.5, { color: C.yellow, alpha: 0.6 }); }
      if (showVel) { const k = A * 0.85 / (A * TAU / S.T); for (const x of xs) cv.arrow(x, y(x), x, y(x) + vxi(x, t) * k, { color: C.vel, width: 1.6, head: 6, alpha: 0.9 }); }
      xs.forEach((x, i) => cv.dot(x, y(x), i === ci ? 6.5 : 4.5, { color: i === ci ? C.yellow : C.wave, stroke: EDGE, width: 1 }));
      // 変位ブラケット
      const xc = xs[ci];
      cv.vbracket(xc, 0, y(xc), '変位', { color: C.yellow, size: 12 });
      // λ ブラケット（山→山）。起点の山は kT が決める＝●をドラッグで別の山へ移せる
      if (showLam) {
        const p = lamAt(t, 0.25, kT); kT = p.k;
        bracketH(cv, p.x, p.x + S.lambda, LAM_YT(), 'λ（山→山）', { color: C.yellow });
      }
    });
    flushBrackets(); cv.drawHandles();
    cv.overlayTL.textContent = '媒質のふるえる向き ↕　波の進む向き →';
  }

  /* --- 縦波の描画 --- */
  const BY = 0.55;                     // 玉列の高さ（x軸は下端に置いて目盛りを重ねない）
  function drawLong(t) {
    const cv = cvL, A = S.A;
    cv.clear(); cv.setView({ x0: X0 - 0.45, x1: X1 + 0.45, y0: 0.02, y1: 1.62 });
    cv.axes({ xLabel: 'x [m]', xStep: 1, yTicks: false, yAxis: false, yStep: 9 });
    const xs = ballXs(N), ci = Math.round((N - 1) / 2), mk = flankMarks(xs, t, showLabels);
    cv.clip(() => {
      if (showLabels) {
        for (const x of denseX(t)) cv.line(x, 0.05, x, 1.0, { color: C.dens, width: 1.4, alpha: ga(0.5), dash: [4, 4] });
        for (const x of rareX(t))  cv.line(x, 0.05, x, 1.0, { color: SPARSE, width: 1.2, alpha: ga(0.35), dash: [2, 5] });
      }
      if (showEq) for (const x of xs) cv.dot(x, BY - 0.28, 1.5, { color: C.muted, alpha: 0.55 });
      if (showTrail) { cv.line(xs[ci] - A, BY, xs[ci] + A, BY, { color: C.yellow, width: 1.2, alpha: 0.35, dash: [3, 3] }); cv.dot(xs[ci], BY - 0.28, 3, { color: C.yellow, alpha: 0.7 }); }
      if (showVel) { const k = 0.9 / (A * TAU / S.T) * Math.min(A, 0.3); for (const x of xs) { const p = x + xi(x, t); cv.arrow(p, BY + 0.26, p + vxi(x, t) * k, BY + 0.26, { color: C.vel, width: 1.6, head: 6, alpha: 0.9, zeroDot: true }); } }
      // 「密／疎」の理由を玉列の上に出す：その位置の両どなりの玉が、つり合いの位置からどちらへずれているか
      if (showLabels) for (let i = 0; i < xs.length; i++) {
        const m = mk.get(i); if (!m) continue;
        cv.arrow(xs[i], BY - 0.13, xs[i] + xi(xs[i], t), BY - 0.13, { color: m === 'd' ? C.dens : SPARSE, width: 2.2, head: 7, zeroDot: true });
      }
      xs.forEach((x, i) => { const m = mk.get(i);
        cv.dot(x + xi(x, t), BY, (i === ci || m) ? 6.5 : 4.5,
          { color: i === ci ? C.yellow : C.wave, stroke: m ? (m === 'd' ? C.dens : SPARSE) : EDGE, width: m ? 2 : 1 }); });
      const xc = xs[ci], d0 = Math.min(xc, xc + xi(xc, t)), d1 = Math.max(xc, xc + xi(xc, t));
      bracketH(cv, d0, d1, BY - 0.28, '変位', { color: C.yellow, below: true, size: 12 });
      if (showLabels) {
        // 添え書き（9文字）は密・疎が λ/2 ごとに並ぶので、投影の大きい文字では入りきらないことがある → 入らなければ省く
        const sub = fits(cv, 9, 10);
        for (const x of denseX(t)) { cv.text('密', x, BY + 0.5, { color: C.dens, bold: true, size: 15 });
          if (sub) cv.text('両側から寄ってくる', x, BY + 0.34, { color: C.dens, size: 10 }); }
        for (const x of rareX(t))  { cv.text('疎', x, BY + 0.5, { color: SPARSE, bold: true, size: 15 });
          if (sub) cv.text('両側へ離れていく', x, BY + 0.34, { color: SPARSE, size: 10 }); }
      }
      // λ ブラケット（密→密）。起点の密は kL が決める＝●をドラッグで別の密へ移せる
      if (showLam) {
        const p = lamAt(t, 0, kL); kL = p.k;
        bracketH(cv, p.x, p.x + S.lambda, LAM_YL(), 'λ（密→密）', { color: C.yellow });
      }
    });
    flushBrackets(); cv.drawHandles();
    cv.overlayTL.textContent = '媒質のふるえる向き ↔　波の進む向き →' + (showVel ? '（橙の矢印は玉の速度）' : '');
  }

  return {
    onShow() { P.sync(); },
    draw(t) {
      lastT = t;
      if (!cvT.box.hidden) drawTrans(t);
      if (!cvL.box.hidden) drawLong(t);
      window.__nami_debug = Object.assign(window.__nami_debug || {}, {
        lt: { t, lambda: S.lambda, T: S.T, showLam,
              lamT: lamAt(t, 0.25, kT), lamL: lamAt(t, 0, kL),
              crests: combX(t, 0.25), dense: denseX(t),
              // 検証用: ブラケットの線上にあるワールド座標 x の画面（ページ）座標
              px: (which, x) => { const cv = which === 'T' ? cvT : cvL, r = cv.el.getBoundingClientRect();
                return { x: r.left + cv.px(x), y: r.top + cv.py(which === 'T' ? LAM_YT() : LAM_YL()) }; } }
      });
    }
  };
}

/* ===================================================================
 *  タブ7  地震のP波・S波（球対称スネルの法則で波線追跡）
 * =================================================================== */
const ER = 6371, R_CMB = 3480, R_ICB = 1221.5, DEG = 180 / Math.PI;
// PREM（Dziewonski & Anderson 1981）の速度多項式をそのまま区分線形にサンプリングした v(r) [km/s]
// 層の区切り（D″＝半径 3480〜3630 km ＝厚さ150 km／410・660 km 不連続／外核・内核）は PREM の値どおり。
// 簡略化したのは次の2点だけ:
//   ① 地殻・海洋（半径 6291 km より上）は省略し、最上部マントルの値 8.08 / 4.47 km/s で代表させる
//   ② 多項式を折れ線で近似する（節点の間は直線補間）
// ※速度分布を「教科書のシャドーゾーンに合う」ように調整することはしない。計算値と観測値のずれは
//   モデルを曲げて消すのではなく、なぜずれるのかを画面で説明する（下の ui.note を参照）。
const VMODEL = {
  P: {

const BPS = {};   // 折れ点（この半径ちょうどで積分を区切る＝RK4 の次数を保つ）
for (const k of ['P', 'S']) {
  const s = new Set([ER, R_CMB, R_ICB]);
  for (const lay of ['mantle', 'outer', 'inner']) { const kn = VMODEL[k][lay]; if (kn) kn.forEach(q => s.add(q[0])); }

const layerOf = r => r > R_CMB ? 'mantle' : (r > R_ICB ? 'outer' : 'inner');
function segIdx(kn, r) { let i = 1; while (i < kn.length - 1 && r > kn[i][0]) i++; return i; }
function vAt(kind, lay, r) {
  const kn = VMODEL[kind][lay]; if (!kn) return 0;
  if (r <= kn[0][0]) return kn[0][1];

  const kn = VMODEL[kind][lay]; if (!kn) return 0;

// 状態 y=[r, Δ, i, τ]  i は外向き動径からの角（0=真上, π=真下）。p = r sin i / v は一定
function deriv(kind, lay, y) {

function traceRay(kind, r0, takeoffDeg, opt) {

      if (newLay !== lay) {

        if (kind === 'S' && newLay === 'outer') { if (raw) raw.push([ny[0], ny[1], ny[3]]); y = ny; end = 'cmb'; break; }

// 描画用に間引いて直交座標へ（震源は上＝θ=0）
function toPath(raw, every) {
  const out = [], n = raw.length, k = Math.max(1, Math.round(n / (every || 150)));
  for (let i = 0; i < n; i += k) { const q = raw[i]; out.push([q[0] * Math.sin(q[1]), q[0] * Math.cos(q[1]), q[2]]); }

  return out;
}
// 「核に入る／入らない」などの境界となる射出角を二分法で求める
function critAngle(kind, r0, ds, pred) {
  let lo = 0.02, hi = 89.95;
  for (let i = 0; i < 34; i++) { const m = (lo + hi) / 2; if (pred(traceRay(kind, r0, m, { ds, keep: false }))) lo = m; else hi = m; }

// 走時 τ から道すじ上の位置を出す（τ は単調に増えるので二分探索）。もう終点に着いていれば null
function posAtTau(path, te) {
  const n = path.length;
  if (!(te >= 0) || n < 2) return null;
  if (te >= path[n - 1][2]) return null;          // 地表（S は外核境界）に着いてしまった
  if (te <= path[0][2]) return [path[0][0], path[0][1]];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (path[m][2] <= te) lo = m; else hi = m; }

    if (path[i][2] <= te) { out.push(path[i]); continue; }
    const a = path[i - 1];
    if (a) {
      const f = (te - a[2]) / Math.max(1e-9, path[i][2] - a[2]);
      out.push([a[0] + (path[i][0] - a[0]) * f, a[1] + (path[i][1] - a[1]) * f]);

// 波面を計算するための射出角の並び。

//   「ここを境に道すじが急に変わる」角（外核・内核の入口）のまわりは指数的に細かく刻む＝波面に段差が出ない。

  const a = [], DOWN = 400, UP = 120;
  for (let k = 0; k <= DOWN; k++) a.push(0.12 + (89.94 - 0.12) * k / DOWN);
  for (let k = 0; k <= UP; k++) a.push(90.06 + (179.88 - 90.06) * k / UP);
  for (const c of crits) if (c > 0.3 && c < 89.6)

const SPEEDS = [15, 30, 60, 120, 300, 600];
const SEIS = { scale: 60, tEnd: 1800 };  // scale=再生速度（画面の1秒＝実際の scale 秒）／tEnd=リピートまでの地震時間 [s]
const SEIS_TAIL = 120;                   // 波が通りぬけてからリピートするまでの余裕（既定 ×60 で約2秒ぶん）
const FRONT_GAP = 420;                   // km。これ以上はなれた隣どうしは「屈折で波面が裂けた所」として細い破線でつなぐ
const BRIDGE_MAX = 3500;                 // km。裂け目がこれより広がったらもう線ではつながない（別々の波面として描く）

function buildSeismic(ctx) {
  let depth = 15, nRays = 36;
  let showPRay = true, showPFront = true, showSRay = true, showSFront = true, showPShadow = true, showSShadow = true, showVprof = false;
  let obsTh = 75 / DEG;
  ctx.layout('side'); ctx.stage.classList.add('earth');

  const cv = ctx.canvas({ title: '地球の断面（模式図）— P波・S波の道すじと波面' });
  cv.setPad({ l: 6, r: 6, t: 6, b: 6 });
  const cvV = ctx.canvas({ title: '地震波の速度分布 v(r)（PREM 簡略）', maximizable: false });
  cvV.box.hidden = true;

  let RAYS = { P: [], S: [] }, ARR = { P: [], S: [] }, BND = null, CRIT = null, busy = false;
  let FRONT = { P: [], S: [] }, frontJob = null, frontReady = false;

  /* --- 表示用の波線（道すじ）。1本も途中で捨てない --- */
  function rebuildRays() {
    const r0 = ER - depth;
    for (const kind of ['P', 'S']) {
      const list = [];
      for (let k = 0; k < nRays; k++) {
        const a = 0.6 + (89.4 - 0.6) * k / (nRays - 1);
        const r = traceRay(kind, r0, a, { ds: 10 });
        list.push({ a, end: r.end, delta: r.delta, tau: r.tau, inner: !!(r.enteredInner || r.bouncedICB), path: toPath(r.raw, 240) });
      }
      RAYS[kind] = list;
    }
    pushDebug();
  }
  function pushDebug() {
    const info = list => list.map(r => {
      const q = r.path[r.path.length - 1];
      let gap = 0;
      for (let i = 1; i < r.path.length; i++) gap = Math.max(gap, Math.hypot(r.path[i][0] - r.path[i - 1][0], r.path[i][1] - r.path[i - 1][1]));
      return { end: r.end, d: r.delta, inner: r.inner, rEnd: Math.hypot(q[0], q[1]), maxGap: gap };
    });
    window.__nami_debug = Object.assign(window.__nami_debug || {}, {
      rays: { P: info(RAYS.P), S: info(RAYS.S) },
      seis: {
        get frontReady() { return frontReady; }, get tEnd() { return SEIS.tEnd; }, get scale() { return SEIS.scale; },
        get nFront() { return { P: FRONT.P.length, S: FRONT.S.length }; },
        front: (kind, te) => frontRuns(FRONT[kind] || [], te).map(run => run.map(p => [p[0], p[1], !!p[2]]))
      }
    });
  }

  /* --- 走時表・シャドーゾーン --- */
  function rebuildAnalysis() {
    const r0 = ER - depth, ds = 16;
    for (const kind of ['P', 'S']) {
      const list = [];
      for (let k = 0; k <= 170; k++) {
        const a = 0.2 + (89.8 - 0.2) * k / 170;
        const r = traceRay(kind, r0, a, { ds, keep: false });
        if (r.end === 'surface') list.push({ a, d: r.delta, t: r.tau, inner: !!(r.enteredInner || r.bouncedICB) });
      }
      ARR[kind] = list;
    }
    const aP = critAngle('P', r0, ds, r => r.enteredCore);
    const dP = traceRay('P', r0, aP, { ds, keep: false }).delta;
    const aICB = critAngle('P', r0, ds, r => r.enteredInner);
    const aS = critAngle('S', r0, ds, r => r.end !== 'surface');
    const dS = traceRay('S', r0, aS, { ds, keep: false }).delta;
    CRIT = { pCore: aP, pInner: aICB, s: aS };
    // 外核だけを通りぬける P（PKP）。内核を通る/内核ではね返る「弱い P」は帯の定義から外す。
    const fd = a => {
      const r = traceRay('P', r0, a, { ds, keep: false });
      return (r.end === 'surface' && r.enteredCore && !r.enteredInner && !r.bouncedICB) ? r.delta : 1e9;
    };
    let ba = aP / 2, bd = 1e9; const M = 90;
    for (let k = 0; k <= M; k++) { const a = 0.02 + (aP - 0.02) * k / M, d = fd(a); if (d < bd) { bd = d; ba = a; } }
    let lo = ba - (aP - 0.02) / M, hi = ba + (aP - 0.02) / M;
    for (let it = 0; it < 28; it++) { const m1 = lo + (hi - lo) * .382, m2 = lo + (hi - lo) * .618; if (fd(m1) < fd(m2)) hi = m2; else lo = m1; }
    BND = { pStart: dP, pEnd: fd((lo + hi) / 2), sStart: dS, depth };
    window.__nami_debug = Object.assign(window.__nami_debug || {}, { shadow: BND });
    readShadow.set(`P：${fmt(BND.pStart, 1)}°〜${fmt(BND.pEnd, 1)}°　／　S：${fmt(BND.sStart, 1)}°以遠`);
    noteWhy.innerHTML = mathHTML(
      `教科書の「P 103°〜143°」とずれる理由：ここで計算しているのは波線（射線）＝スネルの法則でたどれる道すじだけ。` +
      `マントルだけを通って地表にもどる P がとどく限界は計算値 ${fmt(BND.pStart, 1)}°。` +
      `教科書の 103° は、外核の表面をかすめて回り込む P（回折波）まで含めた観測値で、波線の計算には出てこない。` +
      `つまりこの差は速度分布の誤差ではなく、「波線で考える」という方法そのものの限界。` +
      `向こう側の縁 ${fmt(BND.pEnd, 1)}° は、外核を通りぬけた P（PKP）がもどってくる最小の角距離（教科書の 143° にあたる）。` +
      `S の影が ${fmt(BND.sStart, 1)}° 以遠になるのは、液体の外核を S 波が通れず、外核にぶつかった波線がそこで終わるから（波線上の × 印）。` +
      `なお帯の中がまったくの無音ではない：内核を通った（または内核の表面ではね返った）弱い P が届く。帯は「マントルだけを通る P も、外核を通りぬける P（PKP）も届かない範囲」という意味。`

  function rebuildAll() { if (busy) return; busy = true; rebuildRays(); rebuildAnalysis(); busy = false; }

  /* --- 波面用の細かい波線を、画面を止めずに少しずつ計算する --- */
  function startFront() {
    frontReady = false;
    frontJob = {
      r0: ER - depth, qi: 0, queue: [
        { kind: 'P', angles: frontAngles([CRIT.pCore, CRIT.pInner]), out: [], i: 0 },
        { kind: 'S', angles: frontAngles([CRIT.s]), out: [], i: 0 }]

  }
  function stepFront(ms) {
    if (!frontJob) return;
    const t0 = performance.now();
    while (frontJob.qi < frontJob.queue.length) {
      const job = frontJob.queue[frontJob.qi];
      while (job.i < job.angles.length) {
        const a = job.angles[job.i++];
        const r = traceRay(job.kind, frontJob.r0, a, { ds: 12 });
        job.out.push({ a, end: r.end, tau: r.tau, path: toPath(r.raw, 200) });
        if (performance.now() - t0 > ms) return;
      }
      frontJob.qi++;
    }
    FRONT = { P: frontJob.queue[0].out, S: frontJob.queue[1].out };
    let mx = 0;
    for (const k of ['P', 'S']) for (const r of FRONT[k]) if (r.end === 'surface' || r.end === 'cmb') mx = Math.max(mx, r.tau);
    SEIS.tEnd = Math.max(600, Math.round(mx)) + SEIS_TAIL;   // いちばん遅い波が着く時刻＋余裕＝リピート周期
    frontJob = null; frontReady = true; pushDebug();
  }

  // 時刻 te の波面。射出角の順に点をつなぎ、着いてしまった波線の所では終点（地表・外核境界）で閉じる。
  // 返り値は [[x, y, bridge], …] の並び。bridge=true は「その手前の点とのあいだが外核の屈折で裂けた所」＝破線でつなぐ。
  function frontRuns(list, te) {
    const n = list.length; if (!n) return [];
    const pos = [], endp = [];
    for (let i = 0; i < n; i++) {
      pos.push(posAtTau(list[i].path, te));
      const p = list[i].path[list[i].path.length - 1]; endp.push([p[0], p[1]]);
    }
    const runs = []; let run = null;
    const flush = () => { if (run && run.length > 1) runs.push(run); run = null; };
    // つなぎ方は1か所だけで決める: 近ければ実線、裂けていれば破線、開きすぎたらつながない
    const join = (x, y) => {
      const last = run && run.length ? run[run.length - 1] : null;
      if (!last) { run = run || []; run.push([x, y, false]); return; }
      const g = Math.hypot(x - last[0], y - last[1]);
      if (g > BRIDGE_MAX) { flush(); run = [[x, y, false]]; return; }
      run.push([x, y, g > FRONT_GAP]);
    };
    for (let i = 0; i < n; i++) {
      const p = pos[i];
      if (!p) { if (run) { join(endp[i][0], endp[i][1]); flush(); } continue; }   // 波面はその境界（地表・外核）で終わる
      if (!run) { run = []; if (i > 0 && !pos[i - 1]) join(endp[i - 1][0], endp[i - 1][1]); }
      join(p[0], p[1]);
    }
    flush();
    return runs;
  }

  // Δ に最初に着く波。inner=true なら「内核を通った（はね返った）弱い P」しか来ていない。
  function firstArrival(list, d) {
    let best = null, inner = false;
    for (let i = 1; i < list.length; i++) {
      const a = list[i - 1], b = list[i];
      if ((a.d - d) * (b.d - d) <= 0 && Math.abs(a.d - b.d) < 25 && Math.abs(a.d - b.d) > 1e-9) {
        const t = a.t + (b.t - a.t) * (d - a.d) / (b.d - a.d);
        if (best == null || t < best) { best = t; inner = !!(a.inner && b.inner); }
      }
    }
    return best == null ? null : { t: best, inner };
  }

  /* --- 操作パネル（既定） --- */
  ui.buttons(ctx.controls, '表示', []);
  ui.toggle(ctx.controls, { label: 'P波の射線（道すじ）', checked: showPRay, onChange: v => showPRay = v });
  ui.toggle(ctx.controls, { label: 'P波の波面', checked: showPFront, onChange: v => showPFront = v });
  ui.toggle(ctx.controls, { label: 'S波の射線（道すじ）', checked: showSRay, onChange: v => showSRay = v });
  ui.toggle(ctx.controls, { label: 'S波の波面', checked: showSFront, onChange: v => showSFront = v });
  ui.toggle(ctx.controls, { label: 'P波の影（シャドーゾーン）', checked: showPShadow, onChange: v => showPShadow = v });
  ui.toggle(ctx.controls, { label: 'S波の影（シャドーゾーン）', checked: showSShadow, onChange: v => showSShadow = v });
  ui.sep(ctx.controls);
  const sD = ui.slider(ctx.controls, {
    label: '震源の深さ', min: 0, max: 700, step: 5, value: depth, unit: 'km', digits: 0,
    onInput: v => { depth = v; rebuildRays(); }
  });
  sD.el.addEventListener('change', () => rebuildAnalysis());
  ui.slider(ctx.controls, {
    label: '再生速度', min: 0, max: SPEEDS.length - 1, step: 1, value: SPEEDS.indexOf(60),
    fmt: v => `×${SPEEDS[Math.round(v)]}（画面の1秒＝実際の${SPEEDS[Math.round(v)]}秒）`,
    onInput: v => {
      const old = SEIS.scale, nw = SPEEDS[Math.round(v)];
      if (nw !== old) { SEIS.scale = nw; ctx.sim.setT(ctx.sim.t * old / nw); }   // 地震の時刻を保ったまま速さだけ変える
    }
  });
  ui.sep(ctx.controls);
  const readShadow = ui.readout(ctx.controls, { label: 'この速度分布から計算した影', value: '計算中…' });
  const readObs = ui.readout(ctx.controls, { label: '観測点', value: '' });
  const readPS = ui.readout(ctx.controls, { label: '初期微動継続時間 S−P', value: '' });
  ui.note(ctx.controls, '●をドラッグ：灰＝震源の深さ、黄＝観測点。地震計の小窓も図の中で動かせる。');
  ui.note(ctx.controls, 'うすい線＝これから通る道すじ、濃い線＝もう通った所。教科書の値とのずれは「詳しく」。');

  /* --- 「詳しく」 --- */
  const noteWhy = ui.note(ctx.detail, '');
  ui.slider(ctx.detail, {
    label: '表示する波線の本数', min: 12, max: 72, step: 2, value: nRays, digits: 0,
    onInput: v => { nRays = Math.round(v); rebuildRays(); }
  });
  ui.toggle(ctx.detail, {
    label: '速度分布 v(r) のグラフ', checked: showVprof,
    onChange: v => { showVprof = v; cvV.box.hidden = !v; ctx.layout(v ? '2' : '1'); cv.resize(); cvV.resize(); }
  });
  ui.note(ctx.detail, '波線は1本も途中で打ち切っていない。真下に出た P もふくめ、すべて地表までたどってある（まだ波が来ていない先の部分もうすい線で出してある）。内核を通る P（PKIKP）と内核の表面ではね返る P（PKiKP）は細く薄い線。S の波線だけは外核の入口で終わる（液体は S波を通さない）。外核の表面での反射（PcP など）は扱っていない。');
  ui.note(ctx.detail, '波面は表示用の波線ではなく、別に用意した細かい射出角（P・S とも 500〜700 本。外核・内核の入口のまわりは指数的に細かく刻む）で計算している。波面が外核の入口で大きく折れ、そこに細い破線が入るのは、外核で速さが 13.7→8.1 km/s に落ちて波線が急に内側へ曲がり、そのあいだに波線が1本も通らない所ができるから。破線はその「波線では埋まらないすきま」＝影のもとを示している。');
  ui.note(ctx.detail, '時間バーの右端＝いちばん遅い波が地表（S は外核）に着いてから約2秒後（再生速度 ×60 換算で 120 秒ぶん）。そこまで行くと地震発生の瞬間へもどってくり返す。再生速度を変えても右端の「地震発生からの時間」は変わらない（画面の秒数のほうが変わる）。');
  ui.note(ctx.detail, '速度分布は PREM（Dziewonski &amp; Anderson 1981）の値をそのまま折れ線で近似したもの。地殻・海洋だけは省略し、最上部マントルの値で代表させている（厚さ40 kmほどなので角距離への影響は 0.1° 未満）。速度を教科書の 103° に合うように書きかえることはしていない。');

  /* --- ドラッグできる点 --- */
  cv.addHandle({
    color: PROJ ? '#111111' : '#dfe9e3', size: 8, label: '震源',
    get: () => ({ x: 0, y: ER - depth }),
    set: (x, y) => { depth = clamp(ER - Math.hypot(x, y), 0, 700); sD.set(depth, true); rebuildRays(); },
    onEnd: () => rebuildAnalysis()
  });
  cv.addHandle({
    color: C.yellow, size: 8, label: '観測点',
    get: () => ({ x: ER * Math.sin(obsTh), y: ER * Math.cos(obsTh) }),
    set: (x, y) => { obsTh = Math.atan2(x, y); }
  });

  /* --- 地震計の小窓（キャンバス内・どこをつかんでも動かせる） --- */
  let boxF = null, boxDrag = null;
  const boxCompact = () => cv.w < 520;              // スマホ幅では時間の目もりだけの細い帯にする（数値は下の操作パネルにある）
  const BS = PROJ ? 1.3 : 1;                        // 小窓の文字は px 直書き＝SC が効かないので、ここで投影ぶんを掛ける
  function boxRect() {
    const cp = boxCompact();
    // 投影モードは中の文字を BS 倍にするが、横幅は広げない（中央上の「震源」のラベルを隠さない幅に収める）。
    // そのぶん文言を短くし、いちばん長い「初期微動継続時間 S−P」は2行に分ける。
    const W = cp ? Math.min(cv.w - 12, Math.round(244 * BS)) : Math.round(PROJ ? clamp(cv.w * 0.40, 204, 244) : clamp(cv.w * 0.34, 188, 268)),
          H = Math.round((cp ? 76 : 166) * BS);
    // 既定位置（あとはドラッグで自由に動かせる）。投影モードは小窓が一回り大きいので、
    // そのままだと中央上の「震源」のラベルを隠す → 少し下げる（図は左右対称なので右側が隠れても読める）。
    if (!boxF) boxF = cp ? { x: 0, y: 1 } : { x: 0.99, y: 0.03 };
    const fx = Math.max(0, cv.w - W - 8), fy = Math.max(0, cv.h - H - 8);
    return { x: 4 + boxF.x * fx, y: 4 + boxF.y * fy, w: W, h: H, compact: cp };
  }
  const inBox = p => { const r = boxRect(); return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; };
  cv.onDragStart = (wx, wy, p) => { const r = boxRect(); boxDrag = inBox(p) ? { dx: p.x - r.x, dy: p.y - r.y } : null; };
  cv.onDrag = (wx, wy, p) => {
    if (!boxDrag) return;
    const r = boxRect(), fx = Math.max(1, cv.w - r.w - 8), fy = Math.max(1, cv.h - r.h - 8);
    boxF.x = clamp((p.x - boxDrag.dx - 4) / fx, 0, 1);
    boxF.y = clamp((p.y - boxDrag.dy - 4) / fy, 0, 1);
  };
  cv.onDragEnd = () => { boxDrag = null; };
  cv.el.addEventListener('pointermove', ev => {   // 小窓の上では「動かせる」カーソルにする
    const rc = cv.el.getBoundingClientRect(), p = { x: ev.clientX - rc.left, y: ev.clientY - rc.top };
    const onHandle = cv._hit ? cv._hit(p) : null;   // 震源・観測点をつかんでいるかは common.js 側の判定にまかせる
    cv.el.style.cursor = boxDrag ? 'grabbing' : (onHandle ? 'grab' : (inBox(p) ? 'move' : 'pointer'));
  });

  /* --- 地球断面の描画 --- */
  // 投影モードは白地なので、層は「うすい色の面＋濃いふち」にする（暗い茶色のままだと黒い塊に見える）
  const LAY = PROJ ? [
    { r: ER, fill: '#fae3c6', stroke: '#a3662a', label: 'マントル（固体）', lr: 5000, lt: 236 },
    { r: R_CMB, fill: '#fdf3c4', stroke: '#9a7500', label: '外核（液体）＝S波は通れない', lr: 2600, lt: 242 },
    { r: R_ICB, fill: '#dcdcdc', stroke: '#555555', label: '内核（固体）', lr: 640, lt: 236 }
  ] : [
    { r: ER, fill: '#3b2d22', stroke: '#7a5f47', label: 'マントル（固体）', lr: 5000, lt: 236 },
    { r: R_CMB, fill: '#5d3410', stroke: '#c2701f', label: '外核（液体）＝S波は通れない', lr: 2600, lt: 242 },
    { r: R_ICB, fill: '#c8912f', stroke: '#ffd166', label: '内核（固体）', lr: 640, lt: 236 }
  ];
  const LAYLAB = PROJ ? '#4a2600' : '#ffe6c4';   // 層ラベルの文字色
  // 右半分を描いてから、同じ手続きを左右反転してもう一度描く（文字は反転してしまうので外で描く）
  function mirrored(fn) { const g = cv.ctx, X0 = cv.px(0); g.save(); g.translate(2 * X0, 0); g.scale(-1, 1); fn(); g.restore(); }

  function drawRaySet(list, color, te) {
    for (const r of list) {
      cv.plotPts(r.path, { color, width: r.inner ? 1.0 : 1.3, alpha: PROJ ? 0.34 : 0.20 });  // 道すじ全体（うすく）
      const passed = passedPart(r.path, te);
      if (passed.length > 1) cv.plotPts(passed, { color, width: r.inner ? 1.2 : 1.8, alpha: 0.88 });  // もう通った所（濃く）
    }
  }
  function drawFrontSet(list, color, te) {
    for (const run of frontRuns(list, te)) {
      let solid = [run[0]];
      const flush = () => { if (solid.length > 1) cv.plotPts(solid, { color, width: 3, alpha: 0.95 }); };
      for (let i = 1; i < run.length; i++) {
        if (run[i][2]) {   // 屈折で裂けた所は細い破線でつなぐ（波線が1本も通らないすきま＝影のもと）
          flush();
          cv.plotPts([run[i - 1], run[i]], { color, width: 1.2, alpha: 0.5, dash: [5, 6] });
          solid = [run[i]];
        } else solid.push(run[i]);
      }
      flush();
    }
  }

  function drawEarth(t) {
    const te = t * SEIS.scale;                  // 地震発生からの時間 [s]
    cv.clear();
    const need = ER * 1.215, aspect = cv.iw / Math.max(1, cv.ih);
    cv.setViewIso(0, 0, need * Math.max(1, aspect));   // 横幅基準の setViewIso を「縦にも切れない」ようにして使う
    for (const L of LAY) cv.circle(0, 0, L.r, { fill: L.fill, color: L.stroke, width: PROJ ? 2.2 : 1.5 });
    // 角距離の目盛り（影ラベルと重なる角度は数値を省く）
    const pMid = BND ? (BND.pStart + BND.pEnd) / 2 : -99, sMid = BND ? (BND.sStart + 178) / 2 : -99;
    for (let d = 0; d <= 180; d += 30) {
      const nearEdge = BND && ((showPShadow && (Math.abs(d - BND.pStart) < 9 || Math.abs(d - BND.pEnd) < 9)) || (showSShadow && Math.abs(d - BND.sStart) < 9));
      const hide = nearEdge || (BND && ((showPShadow && Math.abs(d - pMid) < 12) || (showSShadow && Math.abs(d - sMid) < 12)));
      for (const sg of [1, -1]) {
        if (d === 0 && sg < 0) continue; if (d === 180 && sg < 0) continue;
        const th = sg * d / DEG, sx = Math.sin(th), cy = Math.cos(th);
        cv.line(ER * 0.965 * sx, ER * 0.965 * cy, ER * sx, ER * cy, { color: C.guide, width: 1, alpha: .55 });
        if (!hide) cv.text(d + '°', ER * 1.118 * sx, ER * 1.118 * cy, { color: C.muted, size: 11, bg: PROJ ? C.textBg : 'rgba(2,5,3,0.6)' });
      }
    }
    // シャドーゾーン（P と S は別々に出し入れできる）
    if (BND && (showPShadow || showSShadow)) {
      const band = (d1, d2, sg, r0, r1) => {
        const p = [], n = Math.max(3, Math.round(Math.abs(d2 - d1)));
        for (let i = 0; i <= n; i++) { const th = sg * (d1 + (d2 - d1) * i / n) / DEG; p.push([r1 * Math.sin(th), r1 * Math.cos(th)]); }
        for (let i = n; i >= 0; i--) { const th = sg * (d1 + (d2 - d1) * i / n) / DEG; p.push([r0 * Math.sin(th), r0 * Math.cos(th)]); }
        return p;
      };
      // 帯は地表のすぐ外側に並べて描く（地球の内部を通る波面や波線と重ならない）
      // 投影モードは帯を太く・濃くする（白地では薄い帯が飛ぶ）。外側の半径は動かさない
      // ＝角距離の数字（1.118・1.178）と重ねないため。内側へ広げて太くする。
      const PB = PROJ ? [ER * 0.994, ER * 1.050] : [ER * 1.004, ER * 1.050];
      const SB = PROJ ? [ER * 1.054, ER * 1.108] : [ER * 1.056, ER * 1.102];
      const bandOpt = col => PROJ ? { color: col, width: 1.2, fill: hexA(col, 0.55), close: true }
                                  : { color: 'none', fill: hexA(col, col === C.wave1 ? 0.45 : 0.38), close: true };
      for (const sg of [1, -1]) {
        if (showSShadow) cv.plotPts(band(BND.sStart, 180, sg, SB[0], SB[1]), bandOpt(C.wave2));
        if (showPShadow) cv.plotPts(band(BND.pStart, BND.pEnd, sg, PB[0], PB[1]), bandOpt(C.wave1));
      }
      // 数字は P と S で半径をずらす（98° と 103° が近くても重ならない）
      const edge = (d, col, rr, rLab) => {
        const th = d / DEG;
        for (const sg of [1, -1]) {
          const sx2 = sg * Math.sin(th), cy2 = Math.cos(th);
          cv.line(ER * 0.985 * sx2, ER * 0.985 * cy2, rr * 1.005 * sx2, rr * 1.005 * cy2, { color: col, width: 1.5, alpha: .9 });
          cv.text(fmt(d, 0) + '°', ER * rLab * sx2, ER * rLab * cy2, { color: col, size: 11, bold: true });
        }
      };
      if (showPShadow) { edge(BND.pStart, C.wave1, PB[1], 1.118); edge(BND.pEnd, C.wave1, PB[1], 1.118); }
      if (showSShadow) edge(BND.sStart, C.wave2, SB[1], 1.178);
      const mid = (BND.pStart + BND.pEnd) / 2 / DEG, rp = (PB[0] + PB[1]) / 2;
      if (showPShadow) cv.text('P波の影', rp * Math.sin(mid), rp * Math.cos(mid), { color: C.wave1, bold: true, size: 12 });
      const ms = (BND.sStart + 178) / 2 / DEG, rs = (SB[0] + SB[1]) / 2;
      if (showSShadow) cv.text('S波の影', rs * Math.sin(ms), rs * Math.cos(ms), { color: C.wave2, bold: true, size: 12 });
    }
    // 波線（道すじ）
    const rays = () => { if (showSRay) drawRaySet(RAYS.S, C.wave2, te); if (showPRay) drawRaySet(RAYS.P, C.wave1, te); };
    rays(); mirrored(rays);
    // 波面
    if (frontReady) {
      const fronts = () => { if (showSFront) drawFrontSet(FRONT.S, C.wave2, te); if (showPFront) drawFrontSet(FRONT.P, C.wave1, te); };
      fronts(); mirrored(fronts);
    }
    // S が止まる点の × 印（文字は反転させられないので左右ぶんをここで置く）
    if (showSRay) {
      let stop = null;
      for (const r of RAYS.S) if (r.end === 'cmb') {
        const q = r.path[r.path.length - 1];
        for (const sg of [1, -1]) cv.text('×', sg * q[0], q[1], { color: C.wave2, bold: true, size: 13, bg: false });
        if (!stop || q[0] > stop[0]) stop = q;
      }
      if (stop) {   // ラベルは左側に置く（右上は地震計の小窓の定位置なので重ねない）
        const L = Math.hypot(stop[0], stop[1]) || 1, f = (R_CMB + 620) / L;
        cv.text('×＝S波はここで止まる', -stop[0] * f, stop[1] * f, { color: C.wave2, size: 11, bold: true, bg: PROJ ? 'rgba(255,255,255,0.93)' : 'rgba(2,5,3,0.92)' });
      }
    }
    // 層ラベル
    for (const L of LAY) { const th = L.lt / DEG; cv.text(L.label, L.lr * Math.sin(th), L.lr * Math.cos(th), { color: LAYLAB, bold: true, size: 12 }); }
    cv.drawHandles();
    drawBox(te);
    cv.overlay.textContent = frontJob ? '波面を計算中…' : '再生速度 ×' + SEIS.scale;
    // 投影モードでは CSS で幅を左 40% に制限して折り返す＝中央上の「震源」のラベルに重ねない
    cv.overlayTL.textContent = '模式図（層の厚さは実際の比率）　外核＝深さ2891 km〜　内核＝深さ5150 km〜';
  }

  /* --- 観測点の簡易地震計（ドラッグで動かせる小窓） --- */
  function drawBox(te) {
    const dObs = Math.abs(obsTh) * DEG, arP = firstArrival(ARR.P, dObs), arS = firstArrival(ARR.S, dObs);
    const tp = arP ? arP.t : null, ts = arS ? arS.t : null;
    const pTag = arP && arP.inner ? '（内核を通った弱い P）' : '';
    readObs.set(`Δ = ${fmt(dObs, 1)}°　P到達 ${tp == null ? '— ' : fmt(tp, 0) + ' s' + pTag}　S到達 ${ts == null ? '—（Sのシャドーゾーン）' : fmt(ts, 0) + ' s'}`);
    readPS.set(tp != null && ts != null ? fmt(ts - tp, 0) + ' s' : '測定できない');
    const g = cv.ctx, r = boxRect(), TMAX = Math.max(1200, SEIS.tEnd);
    const F = (px, bold) => (bold ? 'bold ' : '') + Math.round(px * BS) + 'px system-ui,sans-serif';
    const PX = v => v * BS;                            // 小窓内の px 寸法（投影では一回り大きく）
    g.save();
    // 投影モードは白地なので、小窓も白地＋濃いふちにする（黒い四角にしない）
    g.fillStyle = PROJ ? 'rgba(255,255,255,0.94)' : 'rgba(2,10,6,0.88)';
    g.strokeStyle = boxDrag ? C.yellow : (PROJ ? C.muted : C.line); g.lineWidth = boxDrag ? 2 * BS : 1 * BS;
    g.fillRect(r.x, r.y, r.w, r.h); g.strokeRect(r.x, r.y, r.w, r.h);
    g.textBaseline = 'alphabetic';
    g.fillStyle = C.text; g.font = F(12, true); g.textAlign = 'left';
    g.fillText('観測点の地震計', r.x + PX(10), r.y + PX(18));
    g.fillStyle = C.muted; g.font = F(10); g.textAlign = 'right';
    g.fillText(PROJ ? '⣿ 移動' : '⣿ ドラッグで移動', r.x + r.w - PX(8), r.y + PX(18));
    const axY = r.y + PX(r.compact ? 52 : 58), x0 = r.x + PX(10), x1 = r.x + r.w - PX(10), xOf = ss => x0 + (x1 - x0) * clamp(ss / TMAX, 0, 1);
    g.strokeStyle = C.axis; g.lineWidth = 1 * BS; g.beginPath(); g.moveTo(x0, axY); g.lineTo(x1, axY); g.stroke();
    if (tp != null && ts != null) { g.fillStyle = hexA(C.yellow, PROJ ? 0.28 : 0.18); g.fillRect(xOf(tp), axY - PX(16), xOf(ts) - xOf(tp), PX(16)); }
    const mark = (ss, col, lab) => {
      if (ss == null) return; const X = xOf(ss);
      g.strokeStyle = col; g.lineWidth = 2.5 * BS; g.beginPath(); g.moveTo(X, axY); g.lineTo(X, axY - PX(22)); g.stroke();
      g.fillStyle = col; g.font = F(12, true); g.textAlign = 'center'; g.fillText(lab, X, axY - PX(26));
    };
    mark(tp, C.wave1, 'P'); mark(ts, C.wave2, 'S');
    const Xc = xOf(te); g.strokeStyle = C.yellow; g.lineWidth = 1.5 * BS; g.beginPath(); g.moveTo(Xc, axY + PX(5)); g.lineTo(Xc, axY - PX(30)); g.stroke();
    g.fillStyle = C.muted; g.font = F(10); g.textAlign = 'left'; g.fillText('0', x0, axY + PX(12));
    g.textAlign = 'right'; g.fillText(fmt(TMAX, 0) + ' s', x1, axY + PX(12));
    if (r.compact) { g.restore(); return; }          // 細い帯のときは数値を下の操作パネルにまかせる
    g.textAlign = 'left'; g.font = F(12);
    const li = (txt, col, k) => { g.fillStyle = col; g.fillText(txt, r.x + PX(10), r.y + PX(86 + k * 17)); };
    li('角距離 Δ = ' + fmt(dObs, 1) + '°', C.yellow, 0);
    li('P 到達 ' + (tp == null ? '—' : fmt(tp, 0) + ' s' + pTag), C.wave1, 1);
    li('S 到達 ' + (ts == null ? (PROJ ? '—（Sの影の中）' : '— （Sのシャドーゾーン）') : fmt(ts, 0) + ' s'), C.wave2, 2);
    const sp = tp != null && ts != null ? fmt(ts - tp, 0) + ' s' : '—';
    g.fillStyle = C.text; g.font = F(12, true);
    if (PROJ) {   // 横幅を広げない代わりに2行に分ける
      g.fillText('初期微動継続時間', r.x + PX(10), r.y + PX(86 + 3 * 17));
      g.fillText('S−P = ' + sp, r.x + PX(10), r.y + PX(86 + 4 * 17));
    } else g.fillText('初期微動継続時間 S−P = ' + sp, r.x + PX(10), r.y + PX(86 + 3 * 17));
    g.restore();
  }

  function drawVprof() {
    const c = cvV; c.clear(); c.setView({ x0: 0, x1: 14.5, y0: 0, y1: 6500 });
    c.axes({ xLabel: 'v [km/s]', yLabel: 'r [km]', xStep: 2, yStep: 1000 });
    c.clip(() => {
      for (const [kind, col] of [['P', C.wave1], ['S', C.wave2]]) {
        for (const lay of ['mantle', 'outer', 'inner']) {
          const kn = VMODEL[kind][lay]; if (!kn) continue;
          c.plotPts(kn.map(q => [q[1], q[0]]), { color: col, width: 2.5 });
        }
      }
      for (const r of [R_CMB, R_ICB]) c.line(0, r, 14.5, r, { color: C.guide, width: 1, dash: [4, 4], alpha: .6 });
      c.text('外核（S波は0）', 11.5, R_CMB - 260, { color: C.muted, size: 11 });
    });
  }

  rebuildAll();
  return {
    loop: () => SEIS.tEnd / SEIS.scale,              // 波が通りぬけたら地震発生の瞬間へもどる
    tMax: () => SEIS.tEnd / SEIS.scale,              // 時間バーの右端（地震の時刻でいえば再生速度によらず一定）
    timeLabel: t => '地震発生からの時間 ' + fmt(t * SEIS.scale, 0) + ' s',
    draw(t) { stepFront(10); drawEarth(t); if (!cvV.box.hidden) drawVprof(); }
  };
}

/* ===================================================================
 *  タブ8  縦波の横波表示
 * =================================================================== */
function buildLTG(ctx) {
  let N = 41, rev = false, showLabels = true, showGuides = true, showVel = false;
  let rot = 0, rotTarget = 0, rotT0 = 0, rotFrom = 0;
  const ROTMS = 1300;
  ctx.layout('1'); ctx.stage.classList.add('rows4');

  const c1 = ctx.canvas({ title: '① 縦波（媒質の玉）　x軸の正の向き：右 →　玉が混みあう所＝密（おし縮められて高圧）／すく所＝疎（低圧）' });
  const c2 = ctx.canvas({ title: '② 各点の変位を矢印で（右向きを正）' });
  const c3 = ctx.canvas({ title: '③ 矢印を90°回すと「横波表示」になる（矢印の長さ＝変位の大きさ。回しても長さは変わらない）' });
  const c4 = ctx.canvas({ title: '④ 疎密（圧力）のグラフ　Δρ ∝ −∂ξ/∂x' });
  // 投影モードは文字も余白も 1.6 倍。4段のこのタブでは既定の余白（上下で 78px）だけで描画面が埋まって
  // 図がつぶれるので、目盛りを出さない段の余白を削って中身の高さを取り戻す。
  if (PROJ) {
    c1.setPad({ t: 4, b: 20, l: 14, r: 12 });
    c2.setPad({ t: 3, b: 4, l: 14, r: 12 });
    c3.setPad({ t: 3, b: 4, l: 26, r: 12 });
    c4.setPad({ t: 4, b: 6, l: 30, r: 12 });   // x軸は真ん中＝目盛りは内側に出るので下の余白はいらない
  }

  const P = paramControls(ctx.controls, () => {});
  ui.sep(ctx.controls);
  const rotBtn = ui.button(ctx.controls, { label: '矢印を回す ↻', className: 'primary', onClick: () => {
    rotFrom = rot; rotTarget = (rotTarget === 90 ? 0 : 90); rotT0 = performance.now();
    rotBtn.textContent = rotTarget === 90 ? '矢印を戻す ↺' : '矢印を回す ↻';
  } });
  ui.note(ctx.controls, '回すのは手品ではない：右向きの変位を上向きに、左向きの変位を下向きに写し替えているだけ。矢印の長さ（変位の大きさ）は変えていない。左右のずれは重なって見えないので、縦にそろえて見やすくする約束。');
  ui.toggle(ctx.controls, { label: '疎・密ラベル', checked: showLabels, onChange: v => showLabels = v });
  ui.toggle(ctx.controls, { label: '疎密の位置の縦線', checked: showGuides, onChange: v => showGuides = v });
  ui.note(ctx.controls, '「密」は変位が ＋→− に変わる点。そこでは左どなりの玉が右へ、右どなりの玉が左へずれている＝両側から玉が寄ってくるから混みあう（②の太い2本の矢印）。「疎」はその逆で、両側へ離れていくのですいてくる。');

  const revBtn = ui.button(ctx.detail, { label: '正の向きを反転する（→ ⇄ ←）', onClick: () => {
    rev = !rev; revBtn.classList.toggle('active', rev);
    revNote.textContent = rev ? '変位の正の向き：左 ←（反転中）— ②の矢印と③の横波表示は上下反転する。①の玉の位置と④の疎密は動かない：正の向きは人間が決めた約束にすぎず、玉が実際にどこに並んでいるかは約束のとり方に関係ないから。'
                              : '変位の正の向き：右 →（標準）';
  } });
  const revNote = ui.note(ctx.detail, '変位の正の向き：右 →（標準）');
  ui.toggle(ctx.detail, { label: '媒質の速度矢印（①）', checked: showVel, onChange: v => showVel = v });
  ui.slider(ctx.detail, { label: '玉の数 N', min: 21, max: 61, step: 2, value: N, digits: 0, onInput: v => N = Math.round(v) });

  const sgn = () => (rev ? -1 : 1);
  const VX0 = X0 - 0.45, VX1 = X1 + 0.45;


  function guides(cv, t, y0, y1) {
    if (!showGuides) return;
    for (const x of denseX(t)) cv.line(x, y0, x, y1, { color: C.dens, width: 1.3, alpha: ga(.45), dash: [4, 4] });
    for (const x of rareX(t))  cv.line(x, y0, x, y1, { color: SPARSE, width: 1.1, alpha: ga(.3), dash: [2, 5] });
  }

  const BY1 = 0.5;
  function draw1(t) {
    const cv = c1; cv.clear();
    cv.setView({ x0: VX0, x1: VX1, y0: 0.02, y1: 1.22 });
    cv.axes({ xLabel: 'x [m]', xStep: 1, yTicks: false, yAxis: false, yStep: 9 });
    const xs = ballXs(N), mk = flankMarks(xs, t, showLabels);
    cv.clip(() => {
      guides(cv, t, 0.05, 0.92);
      for (const x of xs) cv.dot(x, BY1 - 0.28, 1.5, { color: C.muted, alpha: .5 });
      if (showVel) { const k = 0.32 / (S.A * TAU / S.T) * Math.min(S.A, 0.3); for (const x of xs) { const p = x + xi(x, t); cv.arrow(p, BY1 + 0.22, p + vxi(x, t) * k, BY1 + 0.22, { color: C.vel, width: 1.5, head: 5, alpha: .85, zeroDot: true }); } }
      // 密・疎をはさむ2つの玉は大きく描く（②の太い矢印と同じ玉）
      xs.forEach((x, i) => { const m = mk.get(i);
        cv.dot(x + xi(x, t), BY1, m ? 6.5 : 4.5, { color: C.wave, stroke: m ? (m === 'd' ? C.dens : SPARSE) : EDGE, width: m ? 2 : 1 }); });
      if (showLabels) {
        for (const x of denseX(t)) cv.text('密', x, BY1 + 0.42, { color: C.dens, bold: true, size: 14 });
        for (const x of rareX(t))  cv.text('疎', x, BY1 + 0.42, { color: SPARSE, bold: true, size: 14 });
      }
    });
  }

  function draw2(t) {
    const cv = c2; cv.clear();
    const yM = Math.max(S.A * 1.5, 0.12);
    cv.setView({ x0: VX0, x1: VX1, y0: -yM, y1: yM });
    cv.axes({ xStep: 1, xTicks: false, yTicks: false, yStep: yM });
    const xs = ballXs(N), mk = flankMarks(xs, t, showLabels);
    cv.clip(() => {
      guides(cv, t, -yM, yM);
      xs.forEach((x, i) => {
        const d = sgn() * xi(x, t), m = mk.get(i);
        cv.arrow(x, 0, x + d, 0, { color: d >= 0 ? C.wave : C.wave1, width: m ? 3.6 : 2, head: m ? 9 : 7, zeroDot: true, alpha: m ? 1 : 0.75 });
      });
      if (showLabels && fits(cv, 3, 11)) {
        for (const x of denseX(t)) cv.text('寄る', x, yM * 0.5, { color: C.dens, bold: true, size: 11 });
        for (const x of rareX(t))  cv.text('離れる', x, -yM * 0.5, { color: SPARSE, bold: true, size: 11 });
      }
    });
    // 投影モードは注記を短く（大きい文字だと図の上の「寄る」ラベルに重なる。長い説明は下の操作パネルにある）
    cv.overlayTL.textContent = (rev ? '変位の正の向き：左 ←' : '変位の正の向き：右 →')
      + (PROJ ? '' : '　太い2本＝密・疎の位置をはさむ玉（密では向かい合い、疎では離れる）');
  }

  function draw3(t) {
    const cv = c3; cv.clear();
    cv.setViewIso((VX0 + VX1) / 2, 0, (VX1 - VX0) / 2);
    cv.axes({ xStep: 1, xTicks: false, yStep: 0.2 });
    const a = rot / DEG, ca = Math.cos(a), sa = Math.sin(a);
    cv.clip(() => {
      guides(cv, t, cv.view.y0, cv.view.y1);
      const xs = ballXs(N), mk = flankMarks(xs, t, showLabels), tips = [];
      for (const x of xs) {
        const d = sgn() * xi(x, t);
        tips.push([x + d * ca, d * sa]);
      }
      if (rot > 1) cv.plotPts(tips, { color: C.wave, width: 2.5, alpha: clamp(rot / 90, 0, 1) });
      // 矢印の色は②と同じ（＋＝緑／−＝青）。回しても色も長さも変えない＝写し替えただけ
      xs.forEach((x, i) => { const d = sgn() * xi(x, t), m = mk.get(i);
        cv.arrow(x, 0, tips[i][0], tips[i][1], { color: d >= 0 ? C.wave : C.wave1, width: m ? 3.2 : 1.8, head: m ? 8 : 6, alpha: m ? 1 : .8, zeroDot: true }); });
      if (rot > 88 && showLabels) {
        for (const x of denseX(t)) cv.text('密', x, cv.view.y1 * 0.86, { color: C.dens, bold: true, size: 14 });
        for (const x of rareX(t))  cv.text('疎', x, cv.view.y1 * 0.86, { color: SPARSE, bold: true, size: 14 });
      }
    });
    // 投影モードでは出さない：90°回したあとの緑の曲線と「密・疎」のラベルがこの位置に来るため。
    // 同じ文は下の操作パネルの注記（「回すのは手品ではない：…」）にそのまま書いてある。
    cv.overlayTL.textContent = PROJ ? ''
                                    : '右向きの変位を上向きに、左向きの変位を下向きに写し替えているだけ（長さはそのまま・図を見やすくするための約束）';
    cv.overlay.textContent = rot > 88 ? '回転 90°　緑の曲線＝矢印の先をつないだもの＝横波表示' : '回転 ' + fmt(rot, 0) + '°';
  }

  function draw4(t) {
    const cv = c4; cv.clear();
    cv.setView({ x0: VX0, x1: VX1, y0: -1.35, y1: 1.35 });
    // 投影モードは y軸ラベルを出さない：文字が大きく、左上の注記（overlayTL）と重なるため。
    // 中身は縦軸の目盛り「密／疎」とパネルの見出しで読める。
    cv.axes({ xLabel: 'x [m]', yLabel: PROJ ? null : '圧力の変化', xStep: 1, yStep: 1, yTick: v => v > 0 ? '密' : (v < 0 ? '疎' : '0') });
    cv.clip(() => {
      guides(cv, t, -1.3, 1.3);
      // Δρ ∝ −∂ξ/∂x を最大値1に規格化 → cos φ
      cv.plot(x => -dxi(x, t) / (S.A * TAU / S.lambda), { color: C.dens, width: 2.8, x0: X0, x1: X1 });
    });
    cv.overlayTL.textContent = '∂ξ/∂x が負＝後ろの玉が追いつく＝混みあう。だから密は −∂ξ/∂x が最大の点';
  }

  return {
    onShow() { P.sync(); },
    draw(t) {
      if (rot !== rotTarget) {
        const k = clamp((performance.now() - rotT0) / ROTMS, 0, 1);
        const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        rot = rotFrom + (rotTarget - rotFrom) * e;
        if (k >= 1) rot = rotTarget;
      }
      draw1(t); draw2(t); draw3(t); draw4(t);
      window.__nami_debug = Object.assign(window.__nami_debug || {}, {
        ltg: {
          t, lambda: S.lambda, T: S.T, A: S.A, rev, rot,
          dense: denseX(t), rare: rareX(t),
          dxi: (x) => dxi(x, t), xi: (x) => xi(x, t), sgn: sgn(),
          flank: (() => { const xs = ballXs(N); return { xs, d: flankPairs(xs, denseX(t)), r: flankPairs(xs, rareX(t)) }; })()
        }
      });
    }
  };
}

/* =================================================================== */
Nami.init({
  title: 'C 縦波',
  footer: '⑥ 同じ媒質を横波／縦波で切り替え　⑦ 地球内部の波線追跡（球対称スネルの法則）　⑧ 縦波を横波表示に直す手順',
  tabs: [
    { id: 'lt',      label: '6 縦波と横波',       period: () => S.T, build: buildLT },
    { id: 'seismic', label: '7 地震のP波・S波',   period: () => SEIS.tEnd / SEIS.scale, build: buildSeismic },
    { id: 'ltgraph', label: '8 縦波の横波表示',   period: () => S.T, build: buildLTG }
  ]
});
})();
