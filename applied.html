<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>E 応用（ホイヘンスの原理） - なみラボ</title>
<link rel="stylesheet" href="common.css">
<style>

  .stage.stageIF{grid-template-columns:2fr 1fr}
  /* 14 反射タブ: 現象（広）＋ 作図（壁に沿って縦長なので細くてよい） */

  @media (max-width:760px){ .panel{min-height:300px} .stage.stageIF,.stage.stageRL{grid-template-columns:1fr} }
  /* 投影モード: 文字・線が 1.6 倍になるぶん操作パネルが高くなるので、図が最低限の高さを保てるようにする */
  html[data-mode=proj] .panel{min-height:345px}
  html[data-mode=proj] .panel canvas{min-height:295px}
  @media (max-width:760px){ html[data-mode=proj] .panel{min-height:260px} }
  /* 19 音の干渉（クインケ管）: 管の図（左・縦長）＋ B の y-t ＋ 振幅−d（右 2 段） */
  .stage.qk{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"pipe rec" "pipe amp"}

  .stage.qk .panel.rec{grid-area:rec;min-height:272px}

  .controls .ctlLabel.hdr{font-weight:900;color:var(--text)}

  .controls .ro{display:flex;flex-wrap:wrap;gap:.25rem 1.1rem;flex-basis:100%;font-variant-numeric:tabular-nums}
  .controls .ro span{white-space:nowrap}

  .meter{display:inline-block;width:190px;max-width:48vw;height:1rem;border:1px solid var(--line);border-radius:5px;background:var(--bg);overflow:hidden;vertical-align:middle}
  .meter > div{height:100%;width:0;background:var(--green)}
  button.stopSnd{border-color:var(--red);color:var(--red);font-weight:800}
  html[data-mode=proj] .controls .note.reason{opacity:1;font-size:.95rem}
  html[data-mode=proj] .stage.qk .panel.pipe{min-height:640px}
  html[data-mode=proj] .stage.qk .panel.rec,html[data-mode=proj] .stage.qk .panel.amp{min-height:312px}
  html[data-mode=proj] .meter{border-width:2px;border-color:var(--text)}
  @media (max-width:760px){
    .stage.qk{grid-template-columns:1fr;grid-template-areas:"pipe" "rec" "amp"}
    .stage.qk .panel.pipe{min-height:430px}
    .stage.qk .panel.rec,.stage.qk .panel.amp{min-height:230px}
    html[data-mode=proj] .stage.qk .panel.pipe{min-height:470px}
    html[data-mode=proj] .stage.qk .panel.rec,html[data-mode=proj] .stage.qk .panel.amp{min-height:260px}
  }
  html[data-mode=proj] .stage.qk .panel canvas{min-height:160px}
</style>
</head><body>
<script src="common.js"></script>
<script>
(() => {
'use strict';
const { C, TAU, ui, fmt, clamp, hexA, PROJ, SC } = Nami;
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

/* ===== 投影モード（白地・黒字・濃い色・太線・大きい文字）用の色 =====
   common.css / common.js は編集しない。ページ側で色を直書きしている所だけ、白地に映える色に差し替える。 */
const WALLC = PROJ ? '#4b554f' : '#8fd6b0';                                    // 壁・境界の線（投影＝濃い灰）
const WALLFILL = PROJ ? 'rgba(75,85,79,0.12)' : 'rgba(143,214,176,0.12)';      // 壁の向こう側の地色
const MED1BG = PROJ ? 'rgba(29,79,196,0.09)' : 'rgba(105,183,255,0.055)';      // 媒質1の地色
const MED2BG = PROJ ? 'rgba(106,31,181,0.10)' : 'rgba(199,146,255,0.075)';     // 媒質2の地色
const GA = (a, p) => hexA(C.guide, PROJ ? p : a);                              // 補助線の灰（白地では濃くする）
/* 濃淡塗り（波動タンク・干渉）: 投影＝白地に青（山）／赤（谷）・0 は白。手元＝黒地に緑／青の発光色。
   1ピクセルごとに呼ぶので Nami.C.shade を 256 段のテーブルに焼いておく。 */
const SHADE_N = 256;
const SHADE_LUT = (() => {
  const a = new Uint8Array(3 * (2 * SHADE_N + 1));
  for (let k = -SHADE_N; k <= SHADE_N; k++) { const c = C.shade(k / SHADE_N), o = 3 * (k + SHADE_N); a[o] = c[0]; a[o + 1] = c[1]; a[o + 2] = c[2]; }
  return a;
})();
function putShade(d, o, sv) {
  let k = (sv * SHADE_N) | 0; if (k > SHADE_N) k = SHADE_N; else if (k < -SHADE_N) k = -SHADE_N;
  const p = 3 * (k + SHADE_N); d[o] = SHADE_LUT[p]; d[o + 1] = SHADE_LUT[p + 1]; d[o + 2] = SHADE_LUT[p + 2];
}
const WALL_RGB = PROJ ? [148, 156, 150] : [124, 134, 128];    // 14 の壁（面が広いので中間の灰。白地で重くしない）
const BAR_RGB = PROJ ? [70, 78, 73] : [124, 134, 128];        // 17 の障壁（細い線なので濃い灰）

/* ===== 計測（fps）: window.__nami_debug ===== */
const DBG = (window.__nami_debug = { tab: '', fps: 0, frames: 0, grid: '', _n: 0, _t0: performance.now() });
function mark(id) {
  if (DBG.tab !== id) { DBG.tab = id; DBG._n = 0; DBG._t0 = performance.now(); }
  DBG.frames++; DBG._n++;
  const now = performance.now(), el = now - DBG._t0;
  if (el >= 500) { DBG.fps = Math.round(DBG._n * 1000 / el); DBG._n = 0; DBG._t0 = now; }
}

/* ===== 数学ヘルパ ===== */
const SN = 4096, ST = new Float32Array(SN);
for (let i = 0; i < SN; i++) ST[i] = Math.sin(TAU * i / SN);
const sinT = p => ST[((p * SN) | 0) & (SN - 1)];   // p は「回転数」単位

// 直線 nx*x+ny*y=c を矩形で切る → [[x,y],[x,y]] | null
function clipLine(nx, ny, c, r) {
  const cs = [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]], out = [];
  for (let k = 0; k < 4; k++) {
    const a = cs[k], b = cs[(k + 1) % 4];
    const fa = nx * a[0] + ny * a[1] - c, fb = nx * b[0] + ny * b[1] - c;
    if ((fa <= 0 && fb > 0) || (fa > 0 && fb <= 0)) {
      const t = fa / (fa - fb);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out.length >= 2 ? [out[0], out[1]] : null;
}
// 平行な波面（山の線）を敷き詰める
function drawCrests(cv, nx, ny, lam, ph, rect, o) {
  let lo = 1e9, hi = -1e9;
  [[rect.x0, rect.y0], [rect.x1, rect.y0], [rect.x1, rect.y1], [rect.x0, rect.y1]].forEach(p => {
    const f = nx * p[0] + ny * p[1]; if (f < lo) lo = f; if (f > hi) hi = f;
  });
  const m0 = Math.ceil(ph - hi / lam), m1 = Math.floor(ph - lo / lam);
  if (m1 - m0 > 200) return;
  for (let m = m0; m <= m1; m++) {
    const seg = clipLine(nx, ny, lam * (ph - m), rect);
    if (seg) cv.line(seg[0][0], seg[0][1], seg[1][0], seg[1][1], o);
  }
}
// ワールド角 a0→a1 の円弧（ピクセル半径）
function arcPx(cv, x, y, rpx, a0, a1, o = {}) {
  const g = cv.ctx; g.save();
  g.strokeStyle = o.color || C.guide; g.lineWidth = o.width || 1.5; g.setLineDash(o.dash || []);
  g.beginPath(); g.arc(cv.px(x), cv.py(y), rpx, -a0, -a1, a1 > a0); g.stroke(); g.restore();
}
// HTML を使える注記（ui.note は textContent のため）
function note(parent, html) { const n = ui.note(parent, ''); n.innerHTML = html; return n; }
function fillRectPx(cv, X, Y, W, H, color) { const g = cv.ctx; g.save(); g.fillStyle = color; g.fillRect(X, Y, W, H); g.restore(); }

/* =========================================================
   E-13 素元波（ホイヘンスの原理）
   ========================================================= */
function buildHuygens(ctx) {
  const cv = ctx.canvas({ title: '上から見た水面 — 波面上の各点から素元波（灰）／その包絡線が次の波面（緑）' });
  const st = { mode: 'plane', N: 12, rq: 0.5, auto: true, env: true, ray: false, half: false, trail: true, lam: 2, T: 2 };

  ui.select(ctx.controls, {
    label: '波面', value: 'plane',
    options: [['plane', '平面波（直線の波面）'], ['sphere', '球面波（円弧の波面）']],
    onChange: v => st.mode = v
  });
  ui.slider(ctx.controls, { label: '波面上の点の数 N', min: 5, max: 40, step: 1, value: 12, digits: 0, onInput: v => st.N = v });
  const sR = ui.slider(ctx.controls, {
    label: '素元波の半径 r', min: 0, max: 1.2, step: 0.01, value: 0.5,
    fmt: x => fmt(x, 2) + ' λ (' + fmt(x * st.lam, 2) + ' m)',
    onInput: v => { st.rq = v; if (st.auto) { st.auto = false; tAuto.set(false, true); } }
  });
  const tAuto = ui.toggle(ctx.controls, { label: '自動で進める', checked: true, onChange: v => st.auto = v });
  ui.toggle(ctx.controls, { label: '包絡線（次の波面）', checked: true, onChange: v => st.env = v });
  ui.toggle(ctx.controls, { label: '射線', checked: false, onChange: v => st.ray = v });
  ui.toggle(ctx.controls, { label: '素元波を半円で描く', checked: false, onChange: v => st.half = v });
  ui.sep(ctx.controls);
  ui.slider(ctx.controls, { label: 'λ', min: 0.6, max: 3, step: 0.1, value: 2, unit: 'm', digits: 1, onInput: v => st.lam = v });
  ui.slider(ctx.controls, { label: 'T', min: 0.5, max: 4, step: 0.1, value: 2, unit: 's', digits: 1, onInput: v => st.T = v });
  const F = ui.formula(ctx.controls, '');
  note(ctx.controls, '波面上の各点から同じ速さの素元波が出る。それらに共通に接する面（<b>包絡面</b>）が Δt 後の波面になる。');
  ui.toggle(ctx.detail, { label: '通り過ぎた波面を残す', checked: true, onChange: v => st.trail = v });

  return {
    draw(t) {
      mark('huygens');
      const lam = st.lam, T = st.T, v = lam / T;
      cv.clear(); cv.setPad({ l: 12, r: 12, t: 12, b: 26 });
      const aspect = cv.iw / Math.max(1, cv.ih);
      const halfW = Math.max(3.2, 1.2 * aspect);
      cv.setViewIso(halfW - 0.9, 0, halfW);
      const V = cv.view;
      cv.axes({ xLabel: 'x [m]', yLabel: 'y [m]', grid: true, yAxis: false, xAxis: false, xStep: 1, yStep: 1 });

      const cyc0 = Math.floor(t / T), fr = t / T - cyc0;
      const rAuto = lam * fr;
      const r = st.auto ? rAuto : st.rq * lam;
      const dt = st.auto ? fr * T : (st.rq * lam) / v;
      const N = st.N | 0;
      const gray = GA(0.5, 0.85);

      if (st.mode === 'plane') {
        const xs = V.x0 + 0.8;
        const K = Math.max(1, Math.floor((V.x1 - 0.7 - xs) / lam));
        const cyc = st.auto ? (cyc0 % K) : 0;
        const x0 = xs + lam * cyc;
        const ySpan = V.y1 * 0.88;
        // 残像（すでに通った波面）
        if (st.trail) for (let c = 0; c < cyc; c++) cv.line(xs + lam * c, -ySpan, xs + lam * c, ySpan, { color: C.wave, width: 2, alpha: 0.22 });
        // 素元波
        if (r > 0.004) for (let k = 0; k < N; k++) {
          const y = N === 1 ? 0 : -ySpan + 2 * ySpan * k / (N - 1);
          cv.circle(x0, y, r, st.half ? { color: gray, width: 1.2, a0: -Math.PI / 2, a1: Math.PI / 2 } : { color: gray, width: 1.2 });
        }
        // 射線
        if (st.ray) { const stp = Math.max(1, Math.round(N / 7)); for (let k = 0; k < N; k += stp) { const y = N === 1 ? 0 : -ySpan + 2 * ySpan * k / (N - 1); cv.arrow(x0, y, x0 + Math.max(r, 0.35) + 0.45, y, { color: C.guide, width: 1.5, alpha: .8 }); } }
        // 元の波面／新しい波面
        cv.line(x0, -ySpan * 1.06, x0, ySpan * 1.06, { color: C.wave, width: 3 });
        for (let k = 0; k < N; k++) { const y = N === 1 ? 0 : -ySpan + 2 * ySpan * k / (N - 1); cv.dot(x0, y, 3.5, { color: C.wave }); }
        if (st.env && r > 0.004) {
          const solid = r > 0.93 * lam;
          cv.line(x0 + r, -ySpan * 1.06, x0 + r, ySpan * 1.06, { color: C.wave, width: 3, dash: solid ? [] : [9, 7] });
          cv.text('新しい波面', x0 + r, ySpan * 1.06, { dy: -10, color: C.wave, bold: true });
        }
        const labLeft = cv.px(x0) - cv.pad.l < 90;   // 画面左端に近いときは右側に出す
        cv.text('元の波面', x0, -ySpan * 0.45, { dx: labLeft ? 8 : -8, align: labLeft ? 'left' : 'right', color: C.wave, bold: true });
      } else {
        const S = { x: V.x0 + 0.55, y: 0 };
        const R0base = Math.max(0.9, lam * 0.7);
        const K = Math.max(1, Math.floor((V.x1 - 0.7 - S.x - R0base) / lam));
        const cyc = st.auto ? (cyc0 % K) : 0;
        const R0 = R0base + lam * cyc;
        // 円弧が画面の上下に収まる範囲にする
        const thMax = clamp(Math.asin(Math.min(1, V.y1 * 0.92 / R0)), 16 * D2R, 72 * D2R);
        if (st.trail) for (let c = 0; c < cyc; c++) {
          const Rc = R0base + lam * c, th = clamp(Math.asin(Math.min(1, V.y1 * 0.92 / Rc)), 16 * D2R, 72 * D2R);
          cv.circle(S.x, S.y, Rc, { color: C.wave, width: 2, alpha: .22, a0: -th, a1: th });
        }
        if (r > 0.004) for (let k = 0; k < N; k++) {
          const th = N === 1 ? 0 : -thMax + 2 * thMax * k / (N - 1);
          const px = S.x + R0 * Math.cos(th), py = S.y + R0 * Math.sin(th);
          cv.circle(px, py, r, st.half ? { color: gray, width: 1.2, a0: -th - Math.PI / 2, a1: -th + Math.PI / 2 } : { color: gray, width: 1.2 });
        }
        if (st.ray) { const stp = Math.max(1, Math.round(N / 7)); for (let k = 0; k < N; k += stp) { const th = N === 1 ? 0 : -thMax + 2 * thMax * k / (N - 1); const L = R0 + Math.max(r, .35) + .45; cv.arrow(S.x + R0 * Math.cos(th), S.y + R0 * Math.sin(th), S.x + L * Math.cos(th), S.y + L * Math.sin(th), { color: C.guide, width: 1.5, alpha: .8 }); } }
        cv.circle(S.x, S.y, R0, { color: C.wave, width: 3, a0: -thMax, a1: thMax });
        for (let k = 0; k < N; k++) { const th = N === 1 ? 0 : -thMax + 2 * thMax * k / (N - 1); cv.dot(S.x + R0 * Math.cos(th), S.y + R0 * Math.sin(th), 3.5, { color: C.wave }); }
        if (st.env && r > 0.004) {
          const solid = r > 0.93 * lam;
          cv.circle(S.x, S.y, R0 + r, { color: C.wave, width: 3, dash: solid ? [] : [9, 7], a0: -thMax, a1: thMax });
          cv.text('新しい波面', S.x + (R0 + r) * Math.cos(thMax * .55), S.y + (R0 + r) * Math.sin(thMax * .55), { dy: -12, color: C.wave, bold: true });
        }
        cv.dot(S.x, S.y, 6, { color: C.yellow, stroke: PROJ ? '#fff' : '#000' });
        cv.text('点波源', S.x, S.y, { dy: 16, color: C.yellow, bold: true });
        cv.text('元の波面', S.x + R0 * Math.cos(-thMax * .62), S.y + R0 * Math.sin(-thMax * .62), { dy: 14, color: C.wave, bold: true });
      }
      cv.text('素元波 r = ' + fmt(r, 2) + ' m', cv.view.x0 + (cv.view.x1 - cv.view.x0) * .5, cv.view.y0, { dy: -12, color: C.guide });
      cv.drawHandles();
      F.set('v = λ/T = ' + fmt(lam, 2) + ' / ' + fmt(T, 2) + ' = <b>' + fmt(lam / T, 2) + '</b> m/s　　'
        + 'Δt = <b>' + fmt(dt, 2) + '</b> s　　r = vΔt = <b>' + fmt(r, 2) + '</b> m');
      if (st.auto) { const q = r / lam; if (Math.abs(sR.get() - q) > 0.005) sR.set(Math.min(1.2, q), true); }
    },
    period: () => st.T
  };
}

/* =========================================================
   2次元 波動タンク（FDTD）共通部 — 14 反射・15 屈折で使う
   格子座標: x は右向き・y は下向き（画像と同じ）。u は変位。
   cfg: media(cA,nx,ny) … クーラン数（セル/ステップ）を書く／wall(wall,nx,ny) … 変位0のセルに1
        inject(un,nx,ny,phase,amp,wall) … 波源（毎ステップ un に書き込む。phase は回転数）
        Tst()→波源の周期[ステップ]／rate()→1秒あたりのステップ数／gain()→明るさ
   ========================================================= */
function createTank(cv, cfg) {
  const BUDGET = cfg.budget || 26000, MAXX = cfg.maxX || 250, MAXY = cfg.maxY || 190;
  let nx = 0, ny = 0, u = null, up, un, cA, sig, wall, off, offg, img;
  let step = 0, acc = 0, phase = 0, warmTo = 0, lvl = 0, absL = 15;

  function alloc(_nx, _ny) {
    nx = _nx; ny = _ny; const n = nx * ny;
    u = new Float32Array(n); up = new Float32Array(n); un = new Float32Array(n);
    cA = new Float32Array(n); sig = new Float32Array(n);
    wall = new Uint8Array(n);
    off = document.createElement('canvas'); off.width = nx; off.height = ny;
    offg = off.getContext('2d'); img = offg.createImageData(nx, ny);
    const dd = img.data; for (let k = 0; k < n; k++) dd[4 * k + 3] = 255;
    step = 0; acc = 0; phase = 0;
    rebuild(); setWarm();
  }
  // 起動・リセット直後だけ早送りして画面を波で満たす（周期の整数倍だけ進めるので位相はずれない）
  function setWarm() { warmTo = cfg.warmSteps ? step + Math.ceil(Math.min(4000, cfg.warmSteps()) / Math.max(6, cfg.Tst())) * Math.max(6, cfg.Tst()) : 0; }
  function rebuild() {
    if (!cA) return;
    // 吸収層（端で反射させない）。厚みは λ に合わせる（長い波は薄い層では吸えない）
    const L = absL = clamp(Math.round(cfg.absorb ? cfg.absorb(nx, ny) : 15), 12, Math.round(Math.min(nx, ny) * 0.22));
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const dist = Math.min(i, j, nx - 1 - i, ny - 1 - j);
      sig[j * nx + i] = dist >= L ? 0 : 0.14 * Math.pow((L - dist) / L, 2);
    }
    cA.fill(0.5); if (cfg.media) cfg.media(cA, nx, ny);
    wall.fill(0); if (cfg.wall) cfg.wall(wall, nx, ny);
    for (let k = 0, n = nx * ny; k < n; k++) if (wall[k]) { u[k] = 0; up[k] = 0; un[k] = 0; }
  }
  function clearField() { if (u) { u.fill(0); up.fill(0); un.fill(0); } step = 0; acc = 0; phase = 0; lvl = 0; setWarm(); }
  function inject(Tst) { cfg.inject(un, nx, ny, phase, Math.min(1, step / (2 * Tst)), wall, absL + 4); }
  function advance(n) {
    if (!u) return;
    const Tst = Math.max(6, cfg.Tst());
    // 弱い減衰（1波長進むごとに約 LOSS の割合で弱まる）。波源の線は戻ってきた波を跳ね返すので、
    // 全反射のように波が閉じ込められる条件で振幅が無限に育つのを防ぐ。格子や速さによらない量にしてある。
    const loss = (cfg.loss == null ? 0.05 : cfg.loss) / Tst;
    for (let s = 0; s < n; s++) {
      for (let j = 1; j < ny - 1; j++) {
        const row = j * nx;
        for (let i = 1; i < nx - 1; i++) {
          const k = row + i;
          if (wall[k]) { un[k] = 0; continue; }
          const c = cA[k];
          const lap = u[k + 1] + u[k - 1] + u[k + nx] + u[k - nx] - 4 * u[k];
          const sg = sig[k] * (c * 2) + loss;
          un[k] = (2 * u[k] - (1 - sg) * up[k] + c * c * lap) / (1 + sg);
        }
      }
      for (let i = 0; i < nx; i++) { un[i] = 0; un[(ny - 1) * nx + i] = 0; }
      for (let j = 0; j < ny; j++) { un[j * nx] = 0; un[j * nx + nx - 1] = 0; }
      phase += 1 / Tst;
      inject(Tst);
      const tmp = up; up = u; u = un; un = tmp;
      step++;
    }
  }
  function render() {
    // 明るさは画面の実効振幅（rms）で自動調整する（全反射などで振幅が大きく変わっても見え方を保つ）。
    let s2 = 0, c2 = 0;
    for (let j = 16; j < ny - 16; j += 2) { const row = j * nx; for (let i = 16; i < nx - 16; i += 2) { const v = u[row + i]; s2 += v * v; c2++; } }
    const rms = Math.sqrt(s2 / Math.max(1, c2));
    lvl = lvl > 0 ? lvl * 0.93 + rms * 0.07 : Math.max(rms, 1e-3);
    const d = img.data, gg = cfg.gain() * 1.7 / Math.max(lvl, 1e-3);
    for (let k = 0, n = nx * ny; k < n; k++) {
      const o = 4 * k;
      if (wall[k]) { d[o] = WALL_RGB[0]; d[o + 1] = WALL_RGB[1]; d[o + 2] = WALL_RGB[2]; continue; }
      let v = u[k] * gg; if (v > 1) v = 1; else if (v < -1) v = -1;
      const m = PROJ ? Math.abs(v) : v * v;   // 弱いところは淡く（全反射で媒質2がぼんやり見えるのを防ぐ）
      if (PROJ) putShade(d, o, v >= 0 ? m : -m);
      else if (v >= 0) { d[o] = 84 * m; d[o + 1] = 255 * m; d[o + 2] = 138 * m; }
      else { d[o] = 60 * m; d[o + 1] = 130 * m; d[o + 2] = 255 * m; }
    }
    offg.putImageData(img, 0, 0);
  }
  function draw(dt, running) {
    cv.setPad({ l: 8, r: 8, t: 8, b: 8 });
    const aspect = cv.iw / Math.max(1, cv.ih);
    const wantX = clamp(Math.round(Math.sqrt(BUDGET * aspect)), 90, MAXX);
    const wantY = clamp(Math.round(BUDGET / wantX), 70, MAXY);
    if (Math.abs(wantX - nx) > 4 || Math.abs(wantY - ny) > 4) alloc(wantX, wantY);
    if (running && step < warmTo) advance(Math.min(16, warmTo - step));
    else if (running && dt > 0) { acc += dt * cfg.rate(); let n = Math.floor(acc); acc -= n; if (n > 24) n = 24; if (n > 0) advance(n); }
    cv.clear(); render();
    const g = cv.ctx; g.save(); g.imageSmoothingEnabled = true;
    g.drawImage(off, cv.pad.l, cv.pad.t, cv.iw, cv.ih); g.restore();
  }
  /* 検証用 */
  function lamRow(j, i0, i1) {   // 行 j の [i0,i1) で零交差の間隔から λ（セル）を測る
    if (!u) return NaN;
    const xs = []; let prev = u[(j | 0) * nx + (i0 | 0)];
    for (let i = (i0 | 0) + 1; i < (i1 | 0); i++) {
      const v = u[(j | 0) * nx + i];
      if (prev !== 0 && v !== 0 && ((prev < 0) !== (v < 0))) xs.push(i - 1 + Math.abs(prev) / (Math.abs(prev) + Math.abs(v)));
      prev = v;
    }
    return xs.length >= 3 ? 2 * (xs[xs.length - 1] - xs[0]) / (xs.length - 1) : NaN;
  }
  function rms(i0, i1, j0, j1) {
    if (!u) return 0;
    let s = 0, c = 0;
    for (let j = j0 | 0; j < (j1 | 0); j++) for (let i = i0 | 0; i < (i1 | 0); i++) { const v = u[j * nx + i]; s += v * v; c++; }
    return Math.sqrt(s / Math.max(1, c));
  }
  return {
    draw, rebuild, advance, lamRow, rms, clear: clearField, warm: setWarm,
    get nx() { return nx; }, get ny() { return ny; }, get step() { return step; }
  };
}

/* 斜めの平面波の波源: 波が入ってくる側の1辺（列または行）に、位置に比例してずらした位相を書き込む。
   辺いっぱいに書くので、波面が画面の端から端まで届く平面波になる。(dgx,dgy)＝進む向き（格子座標・単位）。 */
function injectEdgePlane(un, nx, ny, phase, amp, dgx, dgy, lamCells, wall, margin, edge) {
  const m = margin || 16, lam = Math.max(4, lamCells);
  if (edge === 'col' || (edge !== 'row' && Math.abs(dgx) >= Math.abs(dgy))) {
    const x = dgx > 0 ? m : nx - 1 - m;
    for (let y = 1; y < ny - 1; y++) { const k = y * nx + x; if (!wall[k]) un[k] = amp * sinT(phase - y * dgy / lam); }
  } else {
    const y = dgy > 0 ? m : ny - 1 - m;
    for (let x = 1; x < nx - 1; x++) { const k = y * nx + x; if (!wall[k]) un[k] = amp * sinT(phase - x * dgx / lam); }
  }
}

// 凸多角形を半平面 n·p ≥ c で切る（壁の向こう側を塗るのに使う）
function clipPoly(pts, nx, ny, c) {
  const out = [];
  for (let k = 0; k < pts.length; k++) {
    const a = pts[k], b = pts[(k + 1) % pts.length];
    const fa = nx * a[0] + ny * a[1] - c, fb = nx * b[0] + ny * b[1] - c;
    if (fa >= 0) out.push(a);
    if ((fa >= 0) !== (fb >= 0)) { const s = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s]); }
  }
  return out;
}

/* =========================================================
   E-14 反射 — 左＝隊列モデル（現象）／右＝素元波の作図（i = r）
   壁座標系: p＝壁の法線方向（p ＜ 0 が媒質側）、q＝壁に沿う方向
   ========================================================= */
function buildReflect(ctx) {
  ctx.layout('2'); ctx.stage.classList.add('stageRL');
  const T_DRAFT = '作図（素元波）— 壁上の各点から出た素元波の包絡線が反射波面';
  const T_TANK = '壁つき波動タンク（数値計算）— 壁は変位 0。反射が現象として出る';
  const cvA = ctx.canvas({ title: '隊列モデル — 壁に着いた点から順に、壁に垂直な速度成分だけが反転する' });
  const cvB = ctx.canvas({ title: T_DRAFT });
  const st = { i: 40, wall: 0, lam: 2, T: 2, dots: true, ray: true, wavelet: true, env: true, len: true, sweep: false, tank: false, gain: 1 };
  const SWEEP_MAX = 85, SWEEP_P = 16, TST = 40;   // タンク: λ = 0.5 × 40 = 20 セル

  const sI = ui.slider(ctx.controls, {
    label: '入射角 i', min: 0, max: SWEEP_MAX, step: 1, value: 40, digits: 0, unit: '°',
    onInput: v => { st.i = v; if (st.sweep) { st.sweep = false; tSweep.set(false, true); } reTank(); }
  });
  const sW = ui.slider(ctx.controls, {
    label: '壁の角度', min: -40, max: 40, step: 1, value: 0,
    fmt: x => (Math.abs(x) < 0.5 ? '垂直' : (x > 0 ? '+' : '') + fmt(x, 0) + '°'),
    onInput: v => { st.wall = v; reTank(); }
  });
  const tSweep = ui.toggle(ctx.controls, { label: '入射角を自動で動かす（0°→85°→0°）', checked: false, onChange: v => st.sweep = v });
  ui.sep(ctx.controls);
  ui.toggle(ctx.controls, { label: '波面上の点（隊列）', checked: true, onChange: v => st.dots = v });
  ui.toggle(ctx.controls, { label: '射線・法線・角', checked: true, onChange: v => st.ray = v });
  ui.toggle(ctx.controls, { label: '素元波（右の作図）', checked: true, onChange: v => st.wavelet = v });
  ui.toggle(ctx.controls, { label: '包絡線（反射波面）', checked: true, onChange: v => st.env = v });
  ui.toggle(ctx.controls, { label: "作図の長さ BB′・AA″", checked: true, onChange: v => st.len = v });
  ui.sep(ctx.controls);
  ui.slider(ctx.controls, { label: 'λ', min: 0.6, max: 3, step: 0.1, value: 2, unit: 'm', digits: 1, onInput: v => st.lam = v });
  ui.slider(ctx.controls, { label: 'T', min: 0.5, max: 4, step: 0.1, value: 2, unit: 's', digits: 1, onInput: v => st.T = v });
  ui.legend(ctx.controls, [[C.wave1, '青＝入射波面'], [C.wave2, '赤＝反射波面']]);
  const F = ui.formula(ctx.controls, '');
  note(ctx.controls, '右の作図：壁上の各点から出る素元波の半径＝<b>その点に波面が着いてからの時間 × v</b>（A が最大、B′ は 0）。');
  ui.slider(ctx.detail, { label: 'タンクの明るさ', min: 0.3, max: 3, step: 0.1, value: 1, digits: 1, onInput: v => st.gain = v });
  const tTank = ui.toggle(ctx.detail, { label: '右の画面を「壁つき波動タンク（数値計算）」にする', checked: false, onChange: setTankMode });

  const reTank = () => { tank.rebuild(); if (st.tank) tank.warm(); };

  /* ---------- 幾何 ---------- */
  function geo() {
    const a = st.wall * D2R, i = st.i * D2R;
    return {
      a, i, si: Math.sin(i), ci: Math.cos(i),
      n: { x: Math.cos(a), y: Math.sin(a) }, w: { x: -Math.sin(a), y: Math.cos(a) },
      v: st.lam / st.T, lam: st.lam, T: st.T
    };
  }
  const toW = (g, p, q) => ({ x: p * g.n.x + q * g.w.x, y: p * g.n.y + q * g.w.y });
  const dirs = g => ({
    d: toW(g, g.ci, g.si), d2: toW(g, -g.ci, g.si),      // 進む向き（入射／反射）
    u: toW(g, -g.si, g.ci), u2: toW(g, g.si, g.ci)       // 波面の向き（入射／反射）
  });

  // 壁の角度ハンドル（左の画面）
  cvA.addHandle({
    get: () => { const g = geo(); return toW(g, 0, hLen()); },
    set: (x, y) => { const a = clamp(Math.atan2(-x, y) * R2D, -40, 40); st.wall = a; sW.set(a, true); reTank(); },
    color: C.yellow, r: 24, size: 8
  });
  let hLenV = 1.5;
  function hLen() { return hLenV; }

  /* ---------- 左：隊列モデル ---------- */
  function drawMarch(t) {
    cvA.clear(); cvA.setPad({ l: 10, r: 10, t: 10, b: 22 });
    const g = geo(), D = dirs(g);
    const halfW = clamp(3.4 * g.lam, 2.4, 14);
    cvA.setViewIso(-0.56 * halfW, 0, halfW);
    const V = cvA.view, rect = { x0: V.x0, x1: V.x1, y0: V.y0, y1: V.y1 };
    hLenV = Math.min(V.y1 * 0.62, halfW * 0.55);
    cvA.axes({ grid: true, xStep: 1, yStep: 1, xAxis: false, yAxis: false, xTicks: false, yTicks: false });
    const corners = [[V.x0, V.y0], [V.x1, V.y0], [V.x1, V.y1], [V.x0, V.y1]];
    // 壁の向こう側
    const poly = clipPoly(corners, g.n.x, g.n.y, 0);
    if (poly.length >= 3) cvA.plotPts(poly, { close: true, fill: WALLFILL, color: 'none' });
    let qLo = 1e9, qHi = -1e9;
    corners.forEach(c => { const q = c[0] * g.w.x + c[1] * g.w.y; if (q < qLo) qLo = q; if (q > qHi) qHi = q; });
    const diag = Math.hypot(V.x1 - V.x0, V.y1 - V.y0);
    const sp = (V.x1 - V.x0) / 17;
    const oI = { color: C.wave1, width: 2.6 }, oR = { color: C.wave2, width: 2.6 };

    function arm(K, dir, nrm, sign, o, color, sStar) {
      const seg = clipLine(nrm.x, nrm.y, nrm.x * K.x + nrm.y * K.y, rect);
      if (!seg) return;
      let a = (seg[0][0] - K.x) * dir.x + (seg[0][1] - K.y) * dir.y;
      let b = (seg[1][0] - K.x) * dir.x + (seg[1][1] - K.y) * dir.y;
      if (a > b) { const c = a; a = b; b = c; }
      if (sign > 0) a = Math.max(a, 0); else b = Math.min(b, 0);
      if (b <= a) return;
      cvA.line(K.x + dir.x * a, K.y + dir.y * a, K.x + dir.x * b, K.y + dir.y * b, o);
      if (!st.dots) return;
      let j0 = Math.ceil((sStar + a) / sp), j1 = Math.floor((sStar + b) / sp);
      if (j1 - j0 > 40) j1 = j0 + 40;
      for (let j = j0; j <= j1; j++) { const s = j * sp - sStar; cvA.dot(K.x + dir.x * s, K.y + dir.y * s, 3.2, { color }); }
    }

    cvA.clip(() => {
      if (g.si < 5e-3) {
        // 垂直入射：どの点も同時に壁に着くので、列は曲がらずそのまま折り返す
        const base = t / g.T;
        for (let m = Math.ceil(base - diag / g.lam) - 1; m <= base + diag / g.lam + 1; m++) {
          const L = g.v * (t - m * g.T); if (Math.abs(L) > diag) continue;
          const p = -Math.abs(L), K = toW(g, p, 0);
          arm(K, D.u, D.d, 1, L < 0 ? oI : oR, L < 0 ? C.wave1 : C.wave2, 0);
          arm(K, D.u, D.d, -1, L < 0 ? oI : oR, L < 0 ? C.wave1 : C.wave2, 0);
        }
      } else {
        const tanI = g.si / g.ci;
        const lMin = Math.min(qLo * g.si, 0) - diag, lMax = Math.max(qHi * g.si, 0) + diag;
        let m0 = Math.ceil(t / g.T - lMax / g.lam), m1 = Math.floor(t / g.T - lMin / g.lam);
        if (m1 - m0 > 44) m1 = m0 + 44;
        for (let m = m0; m <= m1; m++) {
          const L = g.v * (t - m * g.T);            // 原点から波面までの進み（負＝まだ手前）
          const K = toW(g, 0, L / g.si), sStar = L / tanI;
          arm(K, D.u, D.d, 1, oI, C.wave1, sStar);
          arm(K, D.u2, D.d2, -1, oR, C.wave2, sStar);
        }
      }
      // 射線・法線・角
      if (st.ray) {
        const gd = GA(.75, .9), Lr = diag * 0.34;
        for (let k = 1; k <= 5; k++) {
          const q = qLo + (qHi - qLo) * k / 6, P = toW(g, 0, q);
          cvA.arrow(P.x - D.d.x * Lr, P.y - D.d.y * Lr, P.x, P.y, { color: gd, width: 1.4, dash: [6, 5], head: 8 });
          cvA.arrow(P.x, P.y, P.x + D.d2.x * Lr, P.y + D.d2.y * Lr, { color: gd, width: 1.4, dash: [6, 5], head: 8 });
        }
        const P = toW(g, 0, qLo + (qHi - qLo) * 0.5);
        const nIn = toW(g, -1, 0);
        cvA.line(P.x, P.y, P.x + nIn.x * Lr * 0.9, P.y + nIn.y * Lr * 0.9, { color: C.muted, width: 1.4, dash: [6, 6] });
        if (g.si >= 0.03) {
          const aN = Math.atan2(nIn.y, nIn.x);
          const ai = angBetween(nIn, { x: -D.d.x, y: -D.d.y }), ar = angBetween(nIn, D.d2);
          arcPx(cvA, P.x, P.y, 40 * SC, aN, aN + ai, { color: C.wave1 });
          arcPx(cvA, P.x, P.y, 52 * SC, aN, aN + ar, { color: C.wave2 });
          const mid1 = rotv(nIn, ai / 2), mid2 = rotv(nIn, ar / 2);
          cvA.textPx('i = ' + fmt(st.i, 0) + '°', cvA.px(P.x) + 56 * SC * mid1.x, cvA.py(P.y) - 56 * SC * mid1.y, { color: C.wave1, bold: true });
          cvA.textPx('r = ' + fmt(st.i, 0) + '°', cvA.px(P.x) + 70 * SC * mid2.x, cvA.py(P.y) - 70 * SC * mid2.y, { color: C.wave2, bold: true });
        }
      }
    });
    // 壁
    const seg = clipLine(g.n.x, g.n.y, 0, rect);
    if (seg) cvA.line(seg[0][0], seg[0][1], seg[1][0], seg[1][1], { color: WALLC, width: 3 });
    cvA.textPx('壁', cvA.px(toW(g, 0, qLo).x), cvA.py(toW(g, 0, qLo).y), { dy: -14 * SC, dx: -6, align: 'right', color: WALLC, bold: true });
    cvA.textPx('方眼 1目盛り = 1 m', cvA.pad.l + 6, cvA.pad.t + cvA.ih - 8, { align: 'left', color: C.muted, size: 11 });
    cvA.drawHandles();
  }
  function angBetween(a, b) { return Math.acos(clamp(a.x * b.x + a.y * b.y, -1, 1)) * Math.sign(a.x * b.y - a.y * b.x || 1); }
  function rotv(v, a) { const c = Math.cos(a), s = Math.sin(a); return { x: v.x * c - v.y * s, y: v.x * s + v.y * c }; }

  /* ---------- 右：素元波の作図 ---------- */
  function draft() {   // 作図の中身を数値で返す（検証用にも使う）
    const g = geo(), D = dirs(g);
    const L = 2 * g.lam;                       // AB′（壁に沿う長さ）
    const arrival = q => q * g.si / g.v;       // 壁の点 q に入射波面が着く時刻（A が t=0）
    const dt = arrival(L);                     // Δt（A が着いてから B′ に着くまで）
    const BB = g.v * dt;                       // BB′（B が媒質中を進む距離）
    const RA = g.v * (dt - arrival(0));        // AA″（A から出た素元波の半径）
    return { g, D, L, dt, BB, RA, radius: q => g.v * (dt - arrival(q)) };
  }
  function drawDraft(t) {
    cvB.clear(); cvB.setPad({ l: 10, r: 10, t: 10, b: 22 });
    const F0 = draft(), g = F0.g, D = F0.D, L = F0.L;
    // 図の要素（壁座標）→ 世界座標で外接箱を求め、画面に収まるように置く
    const A = [0, 0], Bp = [0, L];
    const B = [-g.ci * g.si * L, g.ci * g.ci * L], A2 = [-g.si * g.ci * L, g.si * g.si * L];
    const pad = 0.55 * L;
    const pts = [A, Bp, B, A2, [-0.62 * L, 0], [-0.62 * L, L]];
    const wpts = pts.map(p => toW(g, p[0], p[1]));
    wpts.push({ x: -D.d.x * pad, y: -D.d.y * pad });                       // 入射射線の始点
    wpts.push({ x: D.d2.x * pad, y: D.d2.y * pad });                       // 反射射線の終点
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    wpts.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
    const aspect = cvB.iw / Math.max(1, cvB.ih);
    const halfW = 1.1 * Math.max((x1 - x0) / 2, (y1 - y0) / 2 * aspect);
    cvB.setViewIso((x0 + x1) / 2, (y0 + y1) / 2, halfW);
    const V = cvB.view, rect = { x0: V.x0, x1: V.x1, y0: V.y0, y1: V.y1 };
    const corners = [[V.x0, V.y0], [V.x1, V.y0], [V.x1, V.y1], [V.x0, V.y1]];
    const poly = clipPoly(corners, g.n.x, g.n.y, 0);
    if (poly.length >= 3) cvB.plotPts(poly, { close: true, fill: WALLFILL, color: 'none' });
    const W = (p, q) => toW(g, p, q);
    const Aw = W(0, 0), Bpw = W(0, L), Bw = W(B[0], B[1]), A2w = W(A2[0], A2[1]);
    // ピクセル方向（等方ビュー）— ラベルのずらし量を壁座標で指定する
    const Np = { x: g.n.x, y: -g.n.y }, Wp = { x: g.w.x, y: -g.w.y };
    const lab = (a, b) => ({ dx: a * Np.x + b * Wp.x, dy: a * Np.y + b * Wp.y });
    const degen = g.si < 0.03;

    // 壁
    const seg = clipLine(g.n.x, g.n.y, 0, rect);
    if (seg) cvB.line(seg[0][0], seg[0][1], seg[1][0], seg[1][1], { color: WALLC, width: 3 });

    if (degen) {
      cvB.text('入射角 0°（垂直入射）', (V.x0 + V.x1) / 2, V.y0 + (V.y1 - V.y0) * 0.24, { color: C.muted, bold: true, size: 15 });
      
    } else {
      // 素元波（壁の各点から出た円の、媒質側の半分）
      if (st.wavelet) {
        const aw = Math.atan2(g.w.y, g.w.x);
        for (let k = 0; k <= 6; k++) {
          const q = L * k / 6, R = F0.radius(q), P = W(0, q);
          if (R > 0.004) cvB.circle(P.x, P.y, R, { color: GA(0.6, 0.85), width: 1.3, a0: aw, a1: aw + Math.PI });
          cvB.dot(P.x, P.y, 3.2, { color: C.guide });
        }
      }
      // 入射波面 AB ／ 反射波面 B′A″
      cvB.line(Aw.x, Aw.y, Bw.x, Bw.y, { color: C.wave1, width: 3 });
      if (st.env) {
        const ex = 0.22 * L;
        cvB.line(Bpw.x, Bpw.y, A2w.x - D.u2.x * ex, A2w.y - D.u2.y * ex, { color: C.wave2, width: 3 });
        const lm = lab(-6 * SC, -16 * SC), Ew = { x: A2w.x - D.u2.x * ex * 0.85, y: A2w.y - D.u2.y * ex * 0.85 };
        if (!PROJ) cvB.text('反射波面', Ew.x, Ew.y, { dx: lm.dx, dy: lm.dy, align: 'right', color: C.wave2, bold: true });
      }
      // 長さ（BB′＝青・AA″＝赤・AB′＝灰破線）
      if (st.len) {
        cvB.line(Aw.x, Aw.y, Bpw.x, Bpw.y, { color: hexA(C.muted, .85), width: 1.5, dash: [6, 5] });
        const lm0 = lab(12 * SC, 0);
        cvB.text(PROJ ? "AB′" : "AB′ = " + fmt(L, 2) + ' m', (Aw.x + Bpw.x) / 2, (Aw.y + Bpw.y) / 2, { dx: lm0.dx, dy: lm0.dy, color: C.muted, bold: PROJ });
        cvB.line(Bw.x, Bw.y, Bpw.x, Bpw.y, { color: C.wave1, width: 4.5, alpha: .95 });
        const lm1 = lab(-8 * SC, 14 * SC);
        cvB.text(PROJ ? "BB′" : "BB′ = vΔt = " + fmt(F0.BB, 2) + ' m', (Bw.x + Bpw.x) / 2, (Bw.y + Bpw.y) / 2, { dx: lm1.dx, dy: lm1.dy, align: 'left', color: C.wave1, bold: true });
        cvB.line(Aw.x, Aw.y, A2w.x, A2w.y, { color: C.wave2, width: 4.5, alpha: .95 });
        const lm2 = lab(PROJ ? -16 * SC : -20, PROJ ? -10 * SC : -6), q2 = PROJ ? 0.55 : 0.8;
        cvB.text(PROJ ? 'AA″' : 'AA″ = vΔt = ' + fmt(F0.RA, 2) + ' m', Aw.x + (A2w.x - Aw.x) * q2, Aw.y + (A2w.y - Aw.y) * q2, { dx: lm2.dx, dy: lm2.dy, align: 'right', color: C.wave2, bold: true });
        rightAngle(cvB, Bw, Aw, Bpw);
        rightAngle(cvB, A2w, Aw, Bpw);
      }
      // 点と名前
      cvB.dot(Aw.x, Aw.y, 4.5, { color: C.text }); cvB.dot(Bw.x, Bw.y, 4.5, { color: C.wave1 });
      cvB.dot(Bpw.x, Bpw.y, 4.5, { color: C.wave1 }); cvB.dot(A2w.x, A2w.y, 4.5, { color: C.wave2 });
      const la = lab(10 * SC, -12 * SC), lb = lab(-10 * SC, -10 * SC), lbp = lab(12 * SC, 10 * SC), la2 = lab(-12 * SC, -12 * SC);
      cvB.text('A', Aw.x, Aw.y, { dx: la.dx, dy: la.dy, color: C.text, bold: true });
      cvB.text('B', Bw.x, Bw.y, { dx: lb.dx, dy: lb.dy, color: C.wave1, bold: true });
      cvB.text("B′", Bpw.x, Bpw.y, { dx: lbp.dx, dy: lbp.dy, color: C.wave1, bold: true });
      cvB.text('A″', A2w.x, A2w.y, { dx: la2.dx, dy: la2.dy, color: C.wave2, bold: true });
      // 射線・法線・角
      if (st.ray) {
        const nIn = W(-1, 0), Lp = 0.55 * L;
        cvB.line(Aw.x, Aw.y, Aw.x + nIn.x * Lp, Aw.y + nIn.y * Lp, { color: C.muted, width: 1.4, dash: [6, 6] });
        cvB.arrow(Aw.x - D.d.x * Lp, Aw.y - D.d.y * Lp, Aw.x, Aw.y, { color: C.wave1, width: 2.5 });
        cvB.arrow(Aw.x, Aw.y, Aw.x + D.d2.x * Lp, Aw.y + D.d2.y * Lp, { color: C.wave2, width: 2.5 });
        const aN = Math.atan2(nIn.y, nIn.x);
        const ai = angBetween(nIn, { x: -D.d.x, y: -D.d.y }), ar = angBetween(nIn, D.d2);
        arcPx(cvB, Aw.x, Aw.y, 34 * SC, aN, aN + ai, { color: C.wave1 });
        arcPx(cvB, Aw.x, Aw.y, 46 * SC, aN, aN + ar, { color: C.wave2 });
        const m1 = rotv(nIn, ai / 2), m2 = rotv(nIn, ar / 2);
        if (!PROJ) {   // 投影: 文字が 1.6 倍になると A″ まわりで重なるので弧だけにする（角の値は左の画面と下の読み出しに出ている）
          cvB.textPx('i = ' + fmt(st.i, 0) + '°', cvB.px(Aw.x) + 50 * m1.x, cvB.py(Aw.y) - 50 * m1.y, { color: C.wave1, bold: true });
          cvB.textPx('r = ' + fmt(st.i, 0) + '°', cvB.px(Aw.x) + 72 * m2.x, cvB.py(Aw.y) - 72 * m2.y, { color: C.wave2, bold: true });
        }
      }
    }
    cvB.axes({ grid: true, xStep: 1, yStep: 1, xAxis: false, yAxis: false, xTicks: false, yTicks: false });
    cvB.textPx('方眼 1目盛り = 1 m', cvB.pad.l + 6, cvB.pad.t + cvB.ih - 8, { align: 'left', color: C.muted, size: 11 });
  }
  function rightAngle(cv, P, Q, R) {   // P での直角（PQ・PR 方向に小さな四角）
    const n1 = norm({ x: Q.x - P.x, y: Q.y - P.y }), n2 = norm({ x: R.x - P.x, y: R.y - P.y });
    const s = 9 / cv.sx;
    const a = { x: P.x + n1.x * s, y: P.y + n1.y * s }, b = { x: P.x + n2.x * s, y: P.y + n2.y * s };
    cv.plotPts([[a.x, a.y], [a.x + n2.x * s, a.y + n2.y * s], [b.x, b.y]], { color: hexA(C.muted, .9), width: 1.3 });
  }
  function norm(v) { const L = Math.hypot(v.x, v.y) || 1; return { x: v.x / L, y: v.y / L }; }

  /* ---------- 右：壁つき波動タンク（詳しく） ---------- */
  const tank = createTank(cvB, {
    budget: 64000, maxX: 420, maxY: 260,
    wall: (wl, nx, ny) => {
      const g = geo(), O = { x: nx * 0.74, y: ny * 0.5 };
      const ngx = g.n.x, ngy = -g.n.y;
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) if ((i - O.x) * ngx + (j - O.y) * ngy >= 0) wl[j * nx + i] = 1;
    },
    inject: (un, nx, ny, phase, amp, wall, m) => {
      const g = geo();
      const dgx = g.ci * g.n.x + g.si * g.w.x, dgy = -(g.ci * g.n.y + g.si * g.w.y);
      injectEdgePlane(un, nx, ny, phase, amp, dgx, dgy, 0.5 * TST, wall, m);
    },
    warmSteps: () => 2.4 * Math.max(tank.nx, tank.ny || 160) / 0.5,
    absorb: () => 0.62 * TST / 2,
    Tst: () => TST, rate: () => TST / st.T, gain: () => st.gain
  });
  function drawTank(dt, running) {
    tank.draw(dt, running);
    cvB.textPx('壁（変位 0）　入射角 i = ' + fmt(st.i, 0) + '°　壁の角度 ' + (Math.abs(st.wall) < 0.5 ? '垂直' : fmt(st.wall, 0) + '°'),
      cvB.pad.l + 8, cvB.pad.t + 12 * SC, { align: 'left', color: C.text, size: 12 });
    cvB.textPx(PROJ
      ? 'λ = ' + (TST / 2) + ' セル　T = ' + TST + ' ステップ ＝ ' + fmt(st.T, 1) + ' s'
      : 'λ = ' + (TST / 2) + ' セル（1 m = ' + fmt(TST / 2 / st.lam, 1) + ' セル）　波源の周期 ' + TST + ' ステップ ＝ T = ' + fmt(st.T, 1) + ' s　格子 ' + tank.nx + '×' + tank.ny,
      cvB.pad.l + 8, cvB.pad.t + 30 * SC, { align: 'left', color: C.muted, size: 12 });
  }
  function setTankMode(on) {
    st.tank = on;
    cvB.setTitle(on ? T_TANK : T_DRAFT);
    const sim = ctx.sim;
    sim.stepBack.disabled = on;
    sim.stepBack.title = on ? '波動タンクの表示中は時間を戻せません' : '1コマ戻す（←）';
    if (sim.range) { sim.range.disabled = on; sim.range.title = on ? '波動タンクの表示中は時間を戻せません' : '時間（停止中にドラッグで過去へ戻れる）'; }
    if (on) tank.rebuild();
  }

  return {
    draw(t, dt, running) {
      mark('reflect');
      if (st.sweep) {
        const q = (t / SWEEP_P) - Math.floor(t / SWEEP_P);
        const iNow = Math.round(SWEEP_MAX * (q < 0.5 ? 2 * q : 2 * (1 - q)));
        if (iNow !== st.i) { st.i = iNow; sI.set(iNow, true); if (st.tank) tank.rebuild(); }   // スイープ中は早送りしない（毎秒変わるため）
      }
      drawMarch(t);
      if (st.tank) drawTank(dt, running); else drawDraft(t);
      const F0 = draft(), g = F0.g;
      if (g.si < 0.03) {
        F.set('v = λ/T = ' + fmt(g.lam, 2) + ' / ' + fmt(g.T, 2) + ' = <b>' + fmt(g.v, 2) + '</b> m/s'
          + '<br>入射角 0°：Δt = 0 なので BB′ = AA″ = 0。');
      } else {
        F.set('v = λ/T = ' + fmt(g.lam, 2) + ' / ' + fmt(g.T, 2) + ' = <b>' + fmt(g.v, 2) + '</b> m/s'
          + "　Δt（B が B′ に着くまで）= BB′/v = <b>" + fmt(F0.dt, 2) + '</b> s'
          + "<br>BB′ = v·Δt = " + fmt(g.v, 2) + ' × ' + fmt(F0.dt, 2) + ' = <b>' + fmt(F0.BB, 2) + '</b> m　＝　AA″ = v·Δt = <b>' + fmt(F0.RA, 2) + '</b> m'
          + '　<em>（A は B より Δt だけ早く壁に着いたので、その分だけ素元波が広がっている）</em>'
          + "<br>直角三角形 ABB′ と B′A″A：AB′ = " + fmt(F0.L, 2) + ' m が共通・BB′ = AA″・∠B = ∠A″ = 90° → 合同'
          + '　→　<b>i = r = ' + fmt(st.i, 1) + '</b>°');
      }
      DBG.reflGeom = () => { const g2 = geo(); return { i: st.i, wall: st.wall, lam: st.lam, T: st.T, v: g2.v, tank: st.tank }; };
      DBG.reflPos = (m, s, tt) => {   // 隊列モデルの点（波面 m・波面に沿う位置 s）の時刻 tt での世界座標
        const g2 = geo(), D2 = dirs(g2), tHit = m * g2.T + s * (g2.si / g2.ci) / g2.v;
        if (tt < tHit) { const L = g2.v * (tt - m * g2.T); return { x: s * D2.u.x + L * D2.d.x, y: s * D2.u.y + L * D2.d.y, hit: false }; }
        const P = toW(g2, 0, s / g2.ci), e = g2.v * (tt - tHit);
        return { x: P.x + e * D2.d2.x, y: P.y + e * D2.d2.y, hit: true };
      };
      DBG.reflDraft = () => {         // 作図の検証量（包絡線は B′ から A の素元波への接線として独立に求める）
        const f = draft(), gg = f.g, L = f.L;
        const phi = Math.asin(clamp(f.RA / L, -1, 1));               // B′→A から接線までの角
        const tx = -Math.sin(phi), ty = -Math.cos(phi);               // 接線の向き（壁座標）
        const nlx = -ty, nly = tx;                                    // 接線の法線（壁座標・単位）
        const c = nlx * 0 + nly * L;                                  // 接線: n·X = c （B′=(0,L) を通る）
        let maxErr = 0;
        for (let k = 0; k <= 12; k++) { const q = L * k / 12; maxErr = Math.max(maxErr, Math.abs(Math.abs(nlx * 0 + nly * q - c) - f.radius(q))); }
        const px = -nlx, py = -nly;                                   // 媒質側を向く進行方向
        const r = Math.acos(clamp(-(px * 1 + py * 0), -1, 1)) * R2D;   // 法線 (−1,0) との角
        return { i: st.i, r, ABp: L, BBp: f.BB, AAp: f.RA, dt: f.dt, v: gg.v, maxTangentErr: maxErr };
      };
      DBG.reflTank = () => ({ nx: tank.nx, ny: tank.ny, step: tank.step, lam: TST / 2, on: st.tank,
        e: tank.rms(tank.nx * 0.12, tank.nx * 0.66, tank.ny * 0.2, tank.ny * 0.8) });
    },
    get canStepBack() { return !st.tank; },
    onStep(dir) { if (dir > 0 && st.tank) tank.advance(4); },
    onReset() { tank.clear(); },
    period: () => st.T
  };
}

/* =========================================================
   E-15 屈折（現象）— 左＝隊列モデル／右＝二媒質の波動タンク（λ・v・T を同調）
   ========================================================= */
function buildRefract(ctx) {
  ctx.layout('2');
  const cvA = ctx.canvas({ title: '隊列モデル — 境界に着いた点から順に速さが変わる' });
  const cvB = ctx.canvas({ title: '二媒質の波動タンク（数値計算）— 同じ λ・T・入射角で解いたもの' });
  const st = { v1: 1.5, v2: 1.0, i: 50, T: 2, dots: true, ray: false, gain: 1 };
  const CELL_MIN = 16;   // 遅い側の λ を最低このセル数にする（数値分散を抑える）

  const reTank = () => { tank.rebuild(); tank.warm(); };   // 条件を変えたら早送りして新しい定常状態にする
  ui.slider(ctx.controls, { label: '媒質1の速さ v₁', min: 0.5, max: 2, step: 0.05, value: 1.5, unit: 'm/s', onInput: v => { st.v1 = v; reTank(); } });
  ui.slider(ctx.controls, { label: '媒質2の速さ v₂', min: 0.5, max: 2, step: 0.05, value: 1.0, unit: 'm/s', onInput: v => { st.v2 = v; reTank(); } });
  ui.slider(ctx.controls, { label: '入射角 i', min: 0, max: 80, step: 1, value: 50, digits: 0, unit: '°', onInput: v => { st.i = v; reTank(); } });
  ui.sep(ctx.controls);
  ui.toggle(ctx.controls, { label: '波面上の点（隊列）', checked: true, onChange: v => st.dots = v });
  ui.toggle(ctx.controls, { label: '射線（点が通る道すじ）', checked: false, onChange: v => st.ray = v });
  ui.slider(ctx.controls, { label: 'T（周期）', min: 0.5, max: 4, step: 0.1, value: 2, unit: 's', digits: 1, onInput: v => { st.T = v; reTank(); } });
  const F = ui.formula(ctx.controls, '');
  note(ctx.controls, '作図の手順（素元波から屈折波面をつくる）は「16 屈折の作図と全反射」タブ。');
  ui.slider(ctx.detail, { label: 'タンクの明るさ', min: 0.3, max: 3, step: 0.1, value: 1, digits: 1, onInput: v => st.gain = v });

  /* ---------- 共通の幾何 ---------- */
  function geom() {
    const i = st.i * D2R, si = Math.sin(i), ci = Math.cos(i);
    const v1 = st.v1, v2 = st.v2, T = st.T;
    const s = (v2 / v1) * si, total = s > 1;
    const rr = total ? 0 : Math.asin(clamp(s, -1, 1));
    return { i, si, ci, v1, v2, T, sr: Math.sin(rr), cr: Math.cos(rr), rr, total, lam1: v1 * T, lam2: v2 * T };
  }
  // 1 m あたりのセル数 N（縦に速い側の λ が 5.5 個入る大きさ。ただし遅い側の λ は CELL_MIN セル以上）
  function cellsPerM() {
    const g = geom(), lamFast = Math.max(g.lam1, g.lam2), lamSlow = Math.min(g.lam1, g.lam2);
    const ny = tank.ny || 160;
    return Math.max(ny / (5.5 * lamFast), CELL_MIN / lamSlow);
  }
  function TstOf() { const g = geom(); return Math.max(12, Math.round(2 * cellsPerM() * Math.max(g.lam1, g.lam2))); }
  // 境界を x=xc で横切るレイ上の、波面 m の点の時刻 tt における位置
  function march(xc, m, tt, g) {
    const tc = g.T * m + xc * g.si / g.v1;   // この点が境界に着く時刻
    const d = tc - tt;
    if (d > 0) return { x: xc - g.si * g.v1 * d, y: g.ci * g.v1 * d, med: 1 };
    if (g.total) return null;                 // 全反射：屈折波なし
    const e = -d;
    return { x: xc + g.sr * g.v2 * e, y: -g.cr * g.v2 * e, med: 2 };
  }

  /* ---------- 左：隊列モデル ---------- */
  function drawMarch(t) {
    cvA.clear(); cvA.setPad({ l: 10, r: 10, t: 10, b: 22 });
    const halfW = (tank.nx || 160) / (2 * cellsPerM());   // タンクと同じ横幅［m］
    cvA.setViewIso(0, 0, halfW);
    const V = cvA.view, g = geom();
    fillRectPx(cvA, cvA.pad.l, cvA.py(V.y1), cvA.iw, cvA.py(0) - cvA.py(V.y1), MED1BG);
    fillRectPx(cvA, cvA.pad.l, cvA.py(0), cvA.iw, cvA.py(V.y0) - cvA.py(0), MED2BG);

    // 点の間隔: 波面が画面を横切る長さ（弦）を 15 等分 → どの入射角でも 1 列 15〜30 点になる
    const chord = Math.min((V.x1 - V.x0) / Math.max(g.ci, 0.05), (V.y1 - V.y0) / Math.max(g.si, 0.05));
    const spacing = chord / 15;
    const dxc = spacing / clamp(g.ci, 0.45, 1);
    const o1 = { color: C.wave1, width: 2.4 }, o2 = { color: C.wave, width: 2.4 };

    cvA.clip(() => {
      if (g.si < 1e-3) {
        // 垂直入射：波面は境界に平行なまま（列は曲がらない）
        const base = t / g.T;
        for (let m = Math.ceil(base); m <= base + V.y1 / g.lam1 + 1; m++) {
          const y = g.lam1 * (m - base); if (y <= 0 || y > V.y1) continue;
          cvA.line(V.x0, y, V.x1, y, o1);
          if (st.dots) for (let x = Math.ceil(V.x0 / dxc) * dxc; x <= V.x1; x += dxc) cvA.dot(x, y, 3.2, { color: C.wave1 });
        }
        if (!g.total) for (let m = Math.floor(base); m >= base + V.y0 / g.lam2 - 1; m--) {
          const y = g.lam2 * (m - base); if (y >= 0 || y < V.y0) continue;
          cvA.line(V.x0, y, V.x1, y, o2);
          if (st.dots) for (let x = Math.ceil(V.x0 / dxc) * dxc; x <= V.x1; x += dxc) cvA.dot(x, y, 3.2, { color: C.wave });
        }
      } else {
        // 斜め入射：波面ごとに「境界をちょうど今横切るレイ」x_k を求め、両腕を描く
        const EX = clamp(V.y1 * Math.tan(g.i) + (-V.y0) * (g.total ? 0 : g.sr / Math.max(g.cr, 0.08)) + 1, 1, 24);
        const xcLo = V.x0 - EX, xcHi = V.x1 + EX;
        let m0 = Math.ceil(t / g.T - xcHi * g.si / g.lam1), m1 = Math.floor(t / g.T - xcLo * g.si / g.lam1);
        if (m1 - m0 > 40) m1 = m0 + 40;
        for (let m = m0; m <= m1; m++) {
          const xk = (t - g.T * m) * g.v1 / g.si;              // ちょうど今、境界に着くレイ
          const ci2 = Math.max(g.ci * g.ci, 1e-4), cr2 = Math.max(g.cr * g.cr, 1e-4);
          // 媒質1側の腕：xc ∈ [xk + a1min, xk + a1]
          const a1 = Math.max(0, Math.min(V.y1 / (g.ci * g.si), (V.x1 - xk) / ci2));
          const a1min = Math.max(0, (V.x0 - xk) / ci2);
          if (a1 > 0) {
            const p0 = march(xk, m, t, g), p1 = march(xk + a1, m, t, g);
            if (p0 && p1) cvA.line(p0.x, p0.y, p1.x, p1.y, o1);
            if (st.dots && a1 > a1min) {
              let j0 = Math.ceil((xk + a1min) / dxc), j1 = Math.floor((xk + a1) / dxc);
              if (j1 - j0 > 80) j1 = j0 + 80;
              for (let j = j0; j <= j1; j++) { const p = march(j * dxc, m, t, g); if (p) cvA.dot(p.x, p.y, 3.2, { color: C.wave1 }); }
            }
          }
          // 媒質2側の腕：xc ∈ [xk − a2, xk − a2min]
          if (!g.total) {
            const a2 = Math.max(0, Math.min(-V.y0 * g.v1 / (g.cr * g.v2 * g.si), (xk - V.x0) / cr2));
            const a2min = Math.max(0, (xk - V.x1) / cr2);
            if (a2 > 0) {
              const q0 = march(xk - a2, m, t, g), q1 = march(xk, m, t, g);
              if (q0 && q1) cvA.line(q0.x, q0.y, q1.x, q1.y, o2);
              if (st.dots && a2 > a2min) {
                let j0 = Math.ceil((xk - a2) / dxc), j1 = Math.floor((xk - a2min) / dxc);
                if (j1 - j0 > 80) j1 = j0 + 80;
                for (let j = j0; j <= j1; j++) { const p = march(j * dxc, m, t, g); if (p) cvA.dot(p.x, p.y, 3.2, { color: C.wave }); }
              }
            }
          }
        }
      }
      // 射線（点が通る道すじ）
      if (st.ray) {
        const gd = GA(.75, .9);
        for (let k = 1; k <= 5; k++) {
          const xc = V.x0 + (V.x1 - V.x0) * k / 6;
          const L1 = V.y1 / Math.max(g.ci, .05);
          cvA.arrow(xc - g.si * L1, g.ci * L1, xc, 0, { color: gd, width: 1.4, dash: [6, 5], head: 8 });
          if (!g.total) { const L2 = -V.y0 / Math.max(g.cr, .05); cvA.arrow(xc, 0, xc + g.sr * L2, -g.cr * L2, { color: gd, width: 1.4, dash: [6, 5], head: 8 }); }
        }
      }
    });

    cvA.line(V.x0, 0, V.x1, 0, { color: WALLC, width: 2.5 });
    cvA.axes({ xLabel: 'x [m]', grid: false, xAxis: false, yAxis: false, xTicks: false, yTicks: false });
    cvA.text('媒質1　v₁ = ' + fmt(g.v1, 2) + ' m/s　λ₁ = v₁T = ' + fmt(g.lam1, 2) + ' m', V.x0 + 0.02 * (V.x1 - V.x0), V.y1, { dy: 14 * SC, align: 'left', color: C.wave1, bold: true });
    cvA.text('媒質2　v₂ = ' + fmt(g.v2, 2) + ' m/s' + (g.total ? '' : '　λ₂ = v₂T = ' + fmt(g.lam2, 2) + ' m'), V.x0 + 0.02 * (V.x1 - V.x0), V.y0, { dy: -12 * SC, align: 'left', color: C.dens, bold: true });
    if (g.total) cvA.text('屈折波なし（全反射）', 0, V.y0 * 0.5, { color: C.wave2, bold: true, size: 16 });
    if (g.si < 1e-3) cvA.text('入射角 0°', 0, V.y1 * 0.55, { color: C.muted, size: 13 });
  }

  /* ---------- 右：二媒質の波動タンク ---------- */
  const tank = createTank(cvB, {
    media: (cA, nx, ny) => {
      const jb = ny >> 1, vmax = Math.max(st.v1, st.v2);
      const c1 = 0.5 * st.v1 / vmax, c2 = 0.5 * st.v2 / vmax;
      for (let j = 0; j < ny; j++) { const c = j < jb ? c1 : c2; for (let i = 0; i < nx; i++) cA[j * nx + i] = c; }
    },
    inject: (un, nx, ny, phase, amp, wall, m) => {   // 上の辺から斜めに入射する平面波（吸収層の内側から）
      const i = st.i * D2R, vmax = Math.max(st.v1, st.v2);
      const Tst = TstOf(), lam1c = (0.5 * st.v1 / vmax) * Tst;
      injectEdgePlane(un, nx, ny, phase, amp, Math.sin(i), Math.cos(i), lam1c, wall, m, 'row');
    },
    warmSteps: () => {   // 画面が波で満たされるまでの目安（起動・リセット直後は早送りする）
      const g = geom(), vmax = Math.max(st.v1, st.v2), ny = tank.ny || 160;
      const c1 = 0.5 * st.v1 / vmax, c2 = 0.5 * st.v2 / vmax;
      return ny / (c1 * Math.max(g.ci, 0.25)) + 0.5 * ny / (c2 * Math.max(g.cr, 0.25));
    },
    budget: 64000, maxX: 420, maxY: 260,
    absorb: () => 0.62 * Math.max(st.v1, st.v2) * st.T * cellsPerM(),   // λ（長い方）の 0.6 倍ほど
    Tst: TstOf, rate: () => TstOf() / st.T, gain: () => st.gain
  });
  function drawTank(dt, running) {
    tank.draw(dt, running);
    const g = geom(), N = cellsPerM(), nx = tank.nx, ny = tank.ny;
    const yb = cvB.pad.t + cvB.ih * ((ny >> 1) / ny);
    cvB.linePx(cvB.pad.l, yb, cvB.pad.l + cvB.iw, yb, { color: WALLC, width: 2 });
    cvB.textPx('媒質1　λ₁ = ' + fmt(g.lam1, 2) + ' m = ' + fmt(N * g.lam1, 0) + ' セル', cvB.pad.l + 8, cvB.pad.t + 12 * SC, { align: 'left', color: C.wave1, bold: true, size: 12 });
    cvB.textPx('媒質2　λ₂ = ' + fmt(g.lam2, 2) + ' m = ' + fmt(N * g.lam2, 0) + ' セル', cvB.pad.l + 8, yb + 14 * SC, { align: 'left', color: C.dens, bold: true, size: 12 });
    // 投影では文字が大きく、上の λ₁ ラベルと重なるので、短くして下の余白に置く
    if (PROJ) cvB.textPx('1 m = ' + fmt(N, 1) + ' セル　格子 ' + nx + '×' + ny, cvB.pad.l + cvB.iw - 8, cvB.pad.t + cvB.ih - 12 * SC, { align: 'right', color: C.muted, size: 12 });
    else cvB.textPx('1 m = ' + fmt(N, 1) + ' セル　波源の周期 ' + TstOf() + ' ステップ ＝ T = ' + fmt(st.T, 1) + ' s　格子 ' + nx + '×' + ny,
      cvB.pad.l + cvB.iw - 8, cvB.pad.t + (cvB.iw < 420 ? 30 : 12), { align: 'right', color: C.muted, size: 12 });
  }

  return {
    draw(t, dt, running) {
      mark('refract');
      const g = geom();
      drawTank(dt, running);   // 先に格子を確保（左の縮尺がタンクに合う）
      drawMarch(t);
      DBG.march = (xc, m, tt) => march(xc, m, tt, geom());
      DBG.geom = geom;
      DBG.refractSync = () => {
        const gg = geom(), N = cellsPerM(), nx = tank.nx, ny = tank.ny, jb = ny >> 1;
        return {
          N, nx, ny, Tst: TstOf(), step: tank.step,
          lam1m: gg.lam1, lam2m: gg.lam2, lam1cell: N * gg.lam1, lam2cell: N * gg.lam2,
          halfW: nx / (2 * N), i: st.i, r: gg.rr * R2D,
          lamX1: tank.lamRow(Math.round(jb - ny * 0.22), nx * 0.12, nx * 0.92),   // 境界に沿う見かけの波長（媒質1）
          lamX2: tank.lamRow(Math.round(jb + ny * 0.22), nx * 0.12, nx * 0.92)    // 同（媒質2）
        };
      };
      DBG.probeRF = () => {
        const nx = tank.nx, ny = tank.ny, jb = ny >> 1;
        return {
          med1: tank.rms(nx * 0.25, nx * 0.65, jb - ny * 0.28, jb - ny * 0.05),
          med2: tank.rms(nx * 0.3, nx * 0.9, jb + ny * 0.09, jb + ny * 0.32),
          nx, ny, step: tank.step, Tst: TstOf()
        };
      };
      F.set('v₁ = ' + fmt(g.v1, 2) + ' m/s　v₂ = ' + fmt(g.v2, 2) + ' m/s　T = ' + fmt(g.T, 1) + ' s　→　λ₁ = v₁T = <b>' + fmt(g.lam1, 2) + '</b> m　λ₂ = v₂T = <b>' + fmt(g.lam2, 2) + '</b> m'
        + '<br>i = ' + fmt(st.i, 0) + '°　sin r = (v₂/v₁) sin i = ' + fmt(g.v2 / g.v1, 3) + ' × ' + fmt(g.si, 3) + ' = ' + fmt((g.v2 / g.v1) * g.si, 3)
        + (g.total
          ? '　＞ 1　→　<span class="bad">屈折波なし</span>'
          : '　→　r = <b>' + fmt(g.rr * R2D, 1) + '</b>°'));
    },
    canStepBack: false,
    onReset() { tank.clear(); },
    onStep(dir) { if (dir > 0) tank.advance(Math.max(2, Math.round(TstOf() / 12))); },
    period: () => st.T
  };
}

/* =========================================================
   E-16 屈折の作図と全反射
   ========================================================= */
function buildRefract2(ctx) {
  const cv = ctx.canvas({ title: '屈折の作図 — 境界上の各点から出た素元波（媒質2）の包絡線が屈折波面' });
  const st = { v1: 1.5, v2: 1.0, i: 50, n: 6, wavelet: true, env: true, ray: true, anim: true, len: true, sweep: false, T: 2 };
  const SWEEP_MAX = 85, SWEEP_P = 16;   // i を 0°→85°→0° と 16 秒周期で往復させる

  ui.slider(ctx.controls, { label: '媒質1の速さ v₁', min: 0.5, max: 2, step: 0.05, value: 1.5, unit: 'm/s', onInput: v => st.v1 = v });
  ui.slider(ctx.controls, { label: '媒質2の速さ v₂', min: 0.5, max: 2, step: 0.05, value: 1.0, unit: 'm/s', onInput: v => st.v2 = v });
  const sI = ui.slider(ctx.controls, { label: '入射角 i', min: 0, max: SWEEP_MAX, step: 1, value: 50, digits: 0, unit: '°', onInput: v => { st.i = v; if (st.sweep) { st.sweep = false; tSweep.set(false, true); } } });
  const tSweep = ui.toggle(ctx.controls, { label: '入射角を自動で動かす（0°→85°→0°）', checked: false, onChange: v => st.sweep = v });
  ui.sep(ctx.controls);
  ui.toggle(ctx.controls, { label: '素元波', checked: true, onChange: v => st.wavelet = v });
  ui.toggle(ctx.controls, { label: '包絡線（屈折波面）', checked: true, onChange: v => st.env = v });
  ui.toggle(ctx.controls, { label: '射線・法線・角', checked: true, onChange: v => st.ray = v });
  ui.toggle(ctx.controls, { label: "作図の長さ BB′・AT", checked: true, onChange: v => st.len = v });
  ui.toggle(ctx.controls, { label: '波面アニメーション', checked: true, onChange: v => st.anim = v });
  const F = ui.formula(ctx.controls, '');
  note(ctx.controls, "Δt＝B が B′ に着くまでの時間。その間に <b>B は BB′ = v₁Δt 進み</b>、<b>A からの素元波は半径 AT = v₂Δt に広がる</b>。斜辺 AB′ が共通なので sin i / sin r = v₁/v₂。");
  ui.slider(ctx.detail, { label: '素元波の数', min: 4, max: 8, step: 1, value: 6, digits: 0, onInput: v => st.n = v });
  ui.slider(ctx.detail, { label: 'T（周期）', min: 0.5, max: 4, step: 0.1, value: 2, unit: 's', digits: 1, onInput: v => st.T = v });
  note(ctx.controls, '<b>臨界角</b>：(v₂/v₁) sin i = 1 になる入射角。それより大きい角で屈折波が出ないのが<b>全反射</b>（発展：物理基礎の範囲外）。');

  // ジオメトリ（draw で更新）
  const G = { D: 3, A: { x: -1.5, y: 0 }, hlen: 1.5 };
  cv.addHandle({
    get: () => {
      const i = st.i * D2R;
      return { x: G.A.x - Math.sin(i) * G.hlen, y: G.A.y + Math.cos(i) * G.hlen };
    },
    set: (x, y) => {
      const dx = x - G.A.x, dy = y - G.A.y;
      if (dy <= 0.02) return;
      const a = clamp(Math.atan2(-dx, dy) * R2D, 0, 80);
      st.i = a; sI.set(a, true);
    },
    color: C.yellow, r: 24, size: 8
  });

  return {
    draw(t) {
      mark('refract2');
      if (st.sweep) {   // i を時間の関数として 0°→85°→0° と往復させる（連続に変わる＝全反射になる瞬間が見える）
        const q = (t / SWEEP_P) - Math.floor(t / SWEEP_P);
        const iNow = Math.round(SWEEP_MAX * (q < 0.5 ? 2 * q : 2 * (1 - q)));
        if (iNow !== st.i) { st.i = iNow; sI.set(iNow, true); }
      }
      cv.clear(); cv.setPad({ l: 12, r: 12, t: 12, b: 26 });
      const aspect = cv.iw / Math.max(1, cv.ih);
      const halfW = Math.max(3.4, 2.25 * aspect);
      cv.setViewIso(0, 0, halfW);
      const V = cv.view;
      const D = G.D = clamp(halfW * 0.62, 1.8, 3.6);
      const A = G.A = { x: -D / 2, y: 0 }, Bp = { x: D / 2, y: 0 };
      G.hlen = Math.min(V.y1 * 0.9, D * 0.75);

      // 媒質の背景
      fillRectPx(cv, cv.pad.l, cv.py(V.y1), cv.iw, cv.py(0) - cv.py(V.y1), MED1BG);
      fillRectPx(cv, cv.pad.l, cv.py(0), cv.iw, cv.py(V.y0) - cv.py(0), MED2BG);

      const i = st.i * D2R, si = Math.sin(i), ci = Math.cos(i);
      const v1 = st.v1, v2 = st.v2, T = st.T, lam1 = v1 * T, lam2 = v2 * T;
      const sr = (v2 / v1) * si;
      const total = sr > 1;
      const rr = total ? 0 : Math.asin(clamp(sr, -1, 1));
      const d1 = { x: si, y: -ci }, u1 = { x: ci, y: si };
      const d2 = { x: Math.sin(rr), y: -Math.cos(rr) }, u2 = { x: Math.cos(rr), y: Math.sin(rr) };

      // 波面アニメーション
      if (st.anim) {
        const ph = t / T;
        cv.clip(() => {
          drawCrests(cv, d1.x, d1.y, lam1, ph, { x0: V.x0, x1: V.x1, y0: 0, y1: V.y1 }, { color: C.wave1, width: 1.6, alpha: .45 });
          if (!total) drawCrests(cv, d2.x, d2.y, lam2, ph, { x0: V.x0, x1: V.x1, y0: V.y0, y1: 0 }, { color: C.wave, width: 1.6, alpha: .45 });
        });
      }

      // 境界
      cv.line(V.x0, 0, V.x1, 0, { color: WALLC, width: 2.5 });
      cv.text('媒質1　v₁ = ' + fmt(v1, 2) + ' m/s　λ₁ = ' + fmt(lam1, 2) + ' m', V.x0 + 0.15, V.y1, { dy: 14 * SC, align: 'left', color: C.wave1, bold: true });
      cv.text('媒質2　v₂ = ' + fmt(v2, 2) + ' m/s' + (total ? '' : '　λ₂ = ' + fmt(lam2, 2) + ' m'), V.x0 + 0.15, V.y0 * 0.62, { align: 'left', color: C.dens, bold: true });

      // 作図の途中量: 入射波面の端 B が境界の B′ に着くまでの時間 Δt と、その間の BB′・AT
      const BBp = D * si;                    // BB′ = v₁Δt（媒質1で端 B が進む距離）
      const Tt = BBp / v1;                   // Δt（B→B′ の所要時間）
      const AT = total ? 0 : D * Math.sin(rr); // AT = v₂Δt（同じ Δt に A から出た素元波の半径）
      const degen = si < 0.03;
      if (!degen) {
        const B = { x: A.x + u1.x * D * ci, y: A.y + u1.y * D * ci };
        // 素元波（媒質2側の半円）
        if (st.wavelet && !total) {
          const n = st.n | 0;
          for (let k = 0; k < n; k++) {
            const s = D * k / (n - 1), P = { x: A.x + s, y: 0 }, R = Math.sin(rr) * (D - s);
            if (R > 0.004) cv.circle(P.x, P.y, R, { color: GA(0.55, 0.8), width: 1.2, a0: 0, a1: Math.PI });
            cv.dot(P.x, 0, 3.5, { color: C.guide });
          }
        }
        // 入射波面（A→B、およびB'を通る位置）
        cv.line(A.x, A.y, B.x, B.y, { color: C.wave1, width: 3 });
        cv.text('A', A.x, A.y, { dy: 14 * SC, dx: -10 * SC, color: C.text, bold: true });
        cv.text('B', B.x, B.y, { dy: -12 * SC, color: C.wave1, bold: true });
        const segB = clipLine(u1.y, -u1.x, u1.y * Bp.x - u1.x * Bp.y, { x0: V.x0, x1: V.x1, y0: 0, y1: V.y1 });
        if (segB) cv.line(segB[0][0], segB[0][1], segB[1][0], segB[1][1], { color: C.wave1, width: 2, dash: [8, 6], alpha: .85 });
        cv.dot(Bp.x, 0, 4.5, { color: C.wave1 }); cv.text("B'", Bp.x, 0, { dy: 14 * SC, dx: 10 * SC, color: C.wave1, bold: true });
        // 屈折波面（包絡線）— T は素元波（半径 AT）との接点
        const Tp = total ? null : { x: Bp.x - u2.x * D * Math.cos(rr), y: Bp.y - u2.y * D * Math.cos(rr) };
        if (st.env && Tp) {
          cv.line(Bp.x, Bp.y, Tp.x, Tp.y, { color: C.wave, width: 3 });
          cv.text('屈折波面', (Bp.x + Tp.x) / 2, (Bp.y + Tp.y) / 2, { dy: 14 * SC, dx: 18 * SC, color: C.wave, bold: true });
        }
        // 作図の途中量（長さ）: AB′（共通の斜辺）・BB′ = v₁Δt（青）・AT = v₂Δt（緑）
        if (st.len) {
          cv.line(A.x, A.y, Bp.x, Bp.y, { color: hexA(C.muted, .8), width: 1.5, dash: [6, 5] });
          cv.text(PROJ ? "AB′" : "AB′ = " + fmt(D, 2) + ' m', (A.x + Bp.x) / 2, 0, { dy: -11 * SC, color: C.muted, bold: PROJ });
          cv.line(B.x, B.y, Bp.x, Bp.y, { color: C.wave1, width: 4.5, alpha: .95 });
          cv.text(PROJ ? "BB′" : "BB′ = v₁Δt = " + fmt(BBp, 2) + ' m', (B.x + Bp.x) / 2, (B.y + Bp.y) / 2, { dx: 9 * SC, dy: -6 * SC, align: 'left', color: C.wave1, bold: true });
          if (Tp) {
            cv.line(A.x, A.y, Tp.x, Tp.y, { color: C.wave, width: 4.5, alpha: .95 });
            cv.dot(Tp.x, Tp.y, 4.5, { color: C.wave });
            // 投影では角 r のラベルが T の左下に来るので、点名 T は右下に置く
            cv.text('T', Tp.x, Tp.y, PROJ ? { dx: 13 * SC, dy: 12 * SC, align: 'left', color: C.wave, bold: true } : { dx: -13, dy: 9, color: C.wave, bold: true });
            // 角 r の円弧（A まわり 44px）を避けて、T 寄りにラベルを置く。投影では記号だけ（数値は下の読み出しに出る）
            const qT = PROJ ? 1.2 : 0.9;
            cv.text(PROJ ? 'AT' : 'AT = v₂Δt = ' + fmt(AT, 2) + ' m', A.x + (Tp.x - A.x) * qT, A.y + (Tp.y - A.y) * qT, { dx: PROJ ? -6 * SC : -12, dy: PROJ ? 14 * SC : 16, align: 'right', color: C.wave, bold: true });
          }
        }
        // 射線・法線・角
        if (st.ray) {
          cv.line(A.x, V.y1 * 0.95, A.x, V.y0 * 0.95, { color: C.muted, width: 1.4, dash: [6, 6], alpha: .8 });
          const Lin = Math.min(V.y1 * 0.85 / Math.max(ci, 0.2), 2.4);
          cv.arrow(A.x - d1.x * Lin, A.y - d1.y * Lin, A.x, A.y, { color: C.wave1, width: 2.5 });
          arcPx(cv, A.x, A.y, 44 * SC, Math.PI / 2, Math.PI / 2 + i, { color: C.wave1 });
          cv.textPx('i = ' + fmt(st.i, 0) + '°', cv.px(A.x) + 58 * SC * Math.cos(-(Math.PI / 2 + i / 2)), cv.py(A.y) + 58 * SC * Math.sin(-(Math.PI / 2 + i / 2)), { color: C.wave1, bold: true });
          if (!total) {
            const Lr = Math.min(-V.y0 * 0.85 / Math.max(Math.cos(rr), 0.2), 2.4);
            cv.arrow(A.x, A.y, A.x + d2.x * Lr, A.y + d2.y * Lr, { color: C.wave, width: 2.5 });
            arcPx(cv, A.x, A.y, 44 * SC, -Math.PI / 2, -Math.PI / 2 + rr, { color: C.wave });
            cv.textPx('r = ' + fmt(rr * R2D, 1) + '°', cv.px(A.x) + 58 * SC * Math.cos(Math.PI / 2 - rr / 2), cv.py(A.y) + 58 * SC * Math.sin(Math.PI / 2 - rr / 2), { color: C.wave, bold: true });
          }
        }
        if (total) cv.text('屈折波なし（全反射）', (A.x + Bp.x) / 2, V.y0 * 0.55, { color: C.wave2, bold: true, size: 17 });
      } else {
        cv.text('入射角 0°（垂直入射）', 0, V.y0 * 0.55, { color: C.muted, bold: true, size: 15 });
      }
      cv.drawHandles();

      // 読み出し（作図の途中量 → 式 の順に出す）
      const hasCrit = v2 > v1;                       // 臨界角が存在するのは v₂ > v₁ のときだけ
      const iCrit = hasCrit ? Math.asin(clamp(v1 / v2, -1, 1)) * R2D : NaN;
      const critLine = hasCrit
        ? '<br>臨界角：sin i_c = v₁/v₂ = ' + fmt(v1, 2) + ' / ' + fmt(v2, 2) + ' = ' + fmt(v1 / v2, 3) + '　→　i_c = <b>' + fmt(iCrit, 1) + '</b>°'
          + ''
        : '<br><em>v₂ ≤ v₁ なので (v₂/v₁) sin i は 1 を超えない＝どの入射角でも屈折波が出る（全反射は起きない）</em>';
      if (total) {
        F.set('sin r = (v₂/v₁) sin i = ' + fmt(v2 / v1, 2) + ' × ' + fmt(si, 3) + ' = ' + fmt(sr, 3) + ' ＞ 1'
          + '<br>sin r が 1 を超える角 r は存在しない　→　<span class="bad">屈折波なし（全反射）</span>'
          + critLine);
      } else {
        const n12 = si < 1e-6 ? v1 / v2 : si / Math.sin(rr);
        const step1 = si < 1e-6
          ? '入射角 0°：BB′ = 0、AT = 0（波面は境界に平行なので、進む向きは変わらない）'
          : "Δt（B が B′ に着くまで）= BB′/v₁ = " + fmt(Tt, 2) + ' s　→　'
            + "BB′ = v₁Δt = " + fmt(v1, 2) + ' × ' + fmt(Tt, 2) + ' = ' + fmt(BBp, 2) + ' m　／　'
            + 'AT = v₂Δt = ' + fmt(v2, 2) + ' × ' + fmt(Tt, 2) + ' = ' + fmt(AT, 2) + ' m　／　'
            + "AB′ = " + fmt(D, 2) + ' m（共通の斜辺）';
        const step2 = "sin i = BB′/AB′ = v₁Δt/AB′ = " + fmt(BBp, 2) + ' / ' + fmt(D, 2) + ' = ' + fmt(si, 3)
          + "　　sin r = AT/AB′ = v₂Δt/AB′ = " + fmt(AT, 2) + ' / ' + fmt(D, 2) + ' = ' + fmt(Math.sin(rr), 3);
        F.set(step1 + '<br>' + step2
          + "<br>sin i / sin r = (v₁Δt/AB′) / (v₂Δt/AB′) = " + fmt(si, 3) + ' / ' + fmt(Math.sin(rr), 3) + ' = <b>' + fmt(n12, 3) + '</b>'
          + '　＝　v₁/v₂ = ' + fmt(v1, 2) + ' / ' + fmt(v2, 2) + ' = <b>' + fmt(v1 / v2, 3) + '</b>'
          + '　＝　λ₁/λ₂ = ' + fmt(lam1, 2) + ' / ' + fmt(lam2, 2) + ' = <b>' + fmt(lam1 / lam2, 3) + '</b>'
          + '　＝　n₁₂' + critLine);
      }
    },
    period: () => st.T
  };
}

/* =========================================================
   E-17 回折（2次元波動タンク・FDTD）
   ========================================================= */
function buildDiffract(ctx) {
  const cv = ctx.canvas({ title: '2次元 波動タンク（数値計算）— 左から平面波／中央の障壁とスリット' });
  // v＝クーラン数 s = v·dt/dx（セル/ステップ）、Tst＝波源の周期（ステップ）、λ = v·Tst（セル）は導出量
  const st = { preset: 'single', w: 24, v: 0.5, Tst: 24, sep: 40, gain: 2.2 };
  const lamOf = () => st.v * st.Tst;

  ui.select(ctx.controls, {
    label: 'プリセット', value: 'single',
    options: [['single', '単スリット'], ['double', '二重スリット'], ['none', '障壁なし']],
    onChange: v => { st.preset = v; buildWall(); }
  });
  ui.slider(ctx.controls, { label: 'スリット幅 w', min: 2, max: 60, step: 1, value: 24, digits: 0, unit: 'セル', onInput: v => { st.w = v; buildWall(); } });
  ui.slider(ctx.controls, { label: '波の速さ v', min: 0.15, max: 0.5, step: 0.01, value: 0.5, digits: 2, unit: 'セル/ステップ', onInput: v => { st.v = v; RL.set(fmt(lamOf(), 1) + ' セル'); RO.set(fmt(st.w / lamOf(), 2)); } });
  ui.slider(ctx.controls, { label: '波源の周期 T', min: 10, max: 60, step: 1, value: 24, digits: 0, unit: 'ステップ', onInput: v => { st.Tst = v; RL.set(fmt(lamOf(), 1) + ' セル'); RO.set(fmt(st.w / lamOf(), 2)); } });
  const sSep = ui.slider(ctx.controls, { label: 'スリット間隔 d', min: 12, max: 70, step: 1, value: 40, digits: 0, unit: 'セル', onInput: v => { st.sep = v; buildWall(); } });
  ui.slider(ctx.controls, { label: '明るさ', min: 1, max: 6, step: 0.1, value: 2.2, digits: 1, onInput: v => st.gain = v });
  const RL = ui.readout(ctx.controls, { label: 'λ = vT', value: '' });
  const RO = ui.readout(ctx.controls, { label: 'w / λ', value: '' });
  note(ctx.controls, '<b>λ は直接は決められない</b>：波源が T（f = 1/T）を、媒質が v を決め、λ = vT はその結果。');
  note(ctx.controls, '1セル＝格子の1目盛り。');
  note(ctx.detail, '2次元波動方程式 ∂²u/∂t² = c²∇²u を差分法で解いたもの。');

  // --- 格子 ---
  let nx = 0, ny = 0, u, up, un, wall, sig, off, offg, img, step = 0, acc = 0, phase = 0, lastT = 0;
  function alloc(_nx, _ny) {
    nx = _nx; ny = _ny; const n = nx * ny;
    u = new Float32Array(n); up = new Float32Array(n); un = new Float32Array(n);
    wall = new Uint8Array(n); sig = new Float32Array(n);
    off = document.createElement('canvas'); off.width = nx; off.height = ny;
    offg = off.getContext('2d'); img = offg.createImageData(nx, ny);
    const d = img.data; for (let k = 0; k < n; k++) d[4 * k + 3] = 255;
    const L = 15;
    for (let j = 0; j < ny; j++) for (let i2 = 0; i2 < nx; i2++) {
      const dist = Math.min(i2, j, nx - 1 - i2, ny - 1 - j);
      sig[j * nx + i2] = dist >= L ? 0 : 0.14 * Math.pow((L - dist) / L, 2);
    }
    step = 0; acc = 0; phase = 0; buildWall();
    DBG.grid = nx + '×' + ny;
  }
  const BXR = 0.42; // 障壁の位置（幅に対する割合）
  function buildWall() {
    if (!wall) return;
    wall.fill(0);
    if (st.preset === 'none') return;
    const bx = Math.round(nx * BXR), cy = ny / 2;
    const open = [];
    if (st.preset === 'single') open.push([cy - st.w / 2, cy + st.w / 2]);
    else { open.push([cy - st.sep / 2 - st.w / 2, cy - st.sep / 2 + st.w / 2]); open.push([cy + st.sep / 2 - st.w / 2, cy + st.sep / 2 + st.w / 2]); }
    for (let j = 0; j < ny; j++) {
      let isOpen = false;
      for (const [a, b] of open) if (j >= a && j < b) isOpen = true;
      if (!isOpen) for (let i2 = bx; i2 < bx + 2; i2++) wall[j * nx + i2] = 1;
    }
    for (let k = 0, n = nx * ny; k < n; k++) if (wall[k]) { u[k] = 0; up[k] = 0; un[k] = 0; }
  }
  function clearField() { if (u) { u.fill(0); up.fill(0); un.fill(0); } step = 0; acc = 0; phase = 0; }

  const SRC = 16;
  function advance(n) {
    const C2 = st.v * st.v;               // クーラン数の2乗（v はセル/ステップ）
    const sgK = st.v / 0.5;               // 吸収層の強さは速さに比例させる（v を下げても端で反射させない）
    for (let s = 0; s < n; s++) {
      for (let j = 1; j < ny - 1; j++) {
        const row = j * nx;
        for (let i2 = 1; i2 < nx - 1; i2++) {
          const k = row + i2;
          if (wall[k]) { un[k] = 0; continue; }
          const lap = u[k + 1] + u[k - 1] + u[k + nx] + u[k - nx] - 4 * u[k];
          const sg = sig[k] * sgK;
          un[k] = (2 * u[k] - (1 - sg) * up[k] + C2 * lap) / (1 + sg);
        }
      }
      for (let i2 = 0; i2 < nx; i2++) { un[i2] = 0; un[(ny - 1) * nx + i2] = 0; }
      for (let j = 0; j < ny; j++) { un[j * nx] = 0; un[j * nx + nx - 1] = 0; }
      // 平面波源（左側の列）: 周期 T ステップで振動。v や T を変えても位相は連続
      phase += 1 / st.Tst;
      const amp = Math.min(1, step / (2 * st.Tst));
      const sv = amp * sinT(phase);
      for (let j = 1; j < ny - 1; j++) un[j * nx + SRC] = sv;
      const tmp = up; up = u; u = un; un = tmp;
      step++;
    }
  }
  function render() {
    const d = img.data, g = st.gain;
    for (let k = 0, n = nx * ny; k < n; k++) {
      const o = 4 * k;
      if (wall[k]) { d[o] = BAR_RGB[0]; d[o + 1] = BAR_RGB[1]; d[o + 2] = BAR_RGB[2]; continue; }
      let v = u[k] * g; if (v > 1) v = 1; else if (v < -1) v = -1;
      const m = Math.pow(Math.abs(v), PROJ ? 1 : 0.75);
      if (PROJ) putShade(d, o, v >= 0 ? m : -m);
      else if (v >= 0) { d[o] = 84 * m; d[o + 1] = 255 * m; d[o + 2] = 138 * m; }
      else { d[o] = 60 * m; d[o + 1] = 130 * m; d[o + 2] = 255 * m; }
    }
    offg.putImageData(img, 0, 0);
  }

  return {
    draw(t, dt, running) {
      mark('diffract');
      lastT = t;
      cv.setPad({ l: 8, r: 8, t: 8, b: 8 });
      const aspect = cv.iw / Math.max(1, cv.ih);
      const budget = 26000;
      const wantX = clamp(Math.round(Math.sqrt(budget * aspect)), 90, 250);
      const wantY = clamp(Math.round(budget / wantX), 70, 180);
      if (Math.abs(wantX - nx) > 4 || Math.abs(wantY - ny) > 4) alloc(wantX, wantY);
      if (running && dt > 0) { acc += dt * 150; let n = Math.floor(acc); acc -= n; if (n > 14) n = 14; if (n > 0) advance(n); }
      cv.clear();
      render();
      const g = cv.ctx; g.save(); g.imageSmoothingEnabled = true;
      g.drawImage(off, cv.pad.l, cv.pad.t, cv.iw, cv.ih); g.restore();
      // 注記（v・T（f）・λ = vT を同時に出す）
      const cell = cv.iw / nx, lam = lamOf();
      cv.textPx('v = ' + fmt(st.v, 2) + ' セル/ステップ　　T = ' + (st.Tst | 0) + ' ステップ（f = 1/T = ' + fmt(1 / st.Tst, 3) + ' /ステップ）'
        + '　　λ = vT = ' + fmt(st.v, 2) + ' × ' + (st.Tst | 0) + ' = ' + fmt(lam, 1) + ' セル',
        cv.pad.l + 8, cv.pad.t + 12 * SC, { align: 'left', color: C.text, size: 12 });
      cv.textPx('スリット幅 w = ' + (st.w | 0) + ' セル　→　w/λ = ' + fmt(st.w / lam, 2) + '　（格子 ' + nx + '×' + ny + '）',
        cv.pad.l + 8, cv.pad.t + 30 * SC, { align: 'left', color: C.muted, size: 12 });
      // λ 目盛り
      const x0 = cv.pad.l + cv.iw - 12 - lam * cell, yb = cv.pad.t + cv.ih - 14 * SC;
      g.save(); g.strokeStyle = C.yellow; g.lineWidth = 2 * SC; g.beginPath();
      g.moveTo(x0, yb - 5 * SC); g.lineTo(x0, yb); g.lineTo(x0 + lam * cell, yb); g.lineTo(x0 + lam * cell, yb - 5 * SC); g.stroke(); g.restore();
      cv.textPx(lam * cell > 58 * SC ? 'λ = vT' : 'λ', x0 + lam * cell / 2, yb - 12 * SC, { color: C.yellow, bold: true, size: 12 });
      sSep.box.style.display = st.preset === 'double' ? '' : 'none';
      DBG.probe = () => { // 検証用: 障壁の前後・軸外の振幅（rms）
        const bx = Math.round(nx * BXR), box = (i0, i1, j0, j1) => {
          let s = 0, c = 0;
          for (let j = j0 | 0; j < (j1 | 0); j++) for (let i2 = i0 | 0; i2 < (i1 | 0); i2++) { const v = u[j * nx + i2]; s += v * v; c++; }
          return Math.sqrt(s / Math.max(1, c));
        };
        // 入射側（障壁の手前）で実際の波長を測る: 符号反転の回数から λ ≈ 2L/(反転回数)
        const j0 = (ny / 2) | 0, i0 = SRC + 8, i1 = Math.max(i0 + 8, bx - 6);
        let flips = 0, prev = 0;
        for (let i2 = i0; i2 < i1; i2++) { const v = u[j0 * nx + i2]; if (prev !== 0 && v * prev < 0) flips++; if (Math.abs(v) > 1e-6) prev = v; }
        return {
          front: box(SRC + 4, bx - 4, ny * 0.3, ny * 0.7),
          behindAxis: box(bx + 10, bx + 40, ny * 0.42, ny * 0.58),
          behindOff: box(bx + 10, bx + 40, ny * 0.05, ny * 0.25),
          lamMeas: flips > 0 ? 2 * (i1 - i0) / flips : NaN,
          lamSet: lamOf(), v: st.v, Tst: st.Tst,
          nx, ny, step
        };
      };
      RL.set(fmt(lam, 1) + ' セル');
      RO.set(fmt(st.w / lam, 2));
    },
    canStepBack: false,   // ◀（←キー）は共通フックで無効（場を1ステップずつ積み上げるため）
    onReset() { clearField(); },
    onStep(dir) { if (dir > 0) advance(25); },
    period: () => 2
  };
}

/* =========================================================
   E-18 干渉
   ========================================================= */
function buildInterfere(ctx) {
  ctx.stage.classList.add('stageIF');
  const cv = ctx.canvas({ title: '2点波源の干渉（上から見た水面）' });
  const cvP = ctx.canvas({ title: '点 P の y-t グラフ（P の水面の上下動）' });
  const st = { d: 3, lam: 2, T: 2, anti: false, lines: true, circles: false, gain: 1 };
  const P = { x: 2.4, y: 1.6 };

  ui.slider(ctx.controls, { label: '波源の間隔 d', min: 1, max: 6, step: 0.1, value: 3, unit: 'm', digits: 1, onInput: v => st.d = v });
  ui.select(ctx.controls, { label: '位相', value: '0', options: [['0', '同位相'], ['pi', '逆位相']], onChange: v => st.anti = (v === 'pi') });
  ui.toggle(ctx.controls, { label: '強め合い・弱め合いの線', checked: true, onChange: v => st.lines = v });
  ui.toggle(ctx.controls, { label: '教科書の作図（山＝実線・谷＝破線の同心円）', checked: false, onChange: v => st.circles = v });
  ui.sep(ctx.controls);
  ui.slider(ctx.controls, { label: 'λ', min: 0.6, max: 3, step: 0.1, value: 2, unit: 'm', digits: 1, onInput: v => st.lam = v });
  ui.slider(ctx.controls, { label: 'T', min: 0.5, max: 4, step: 0.1, value: 2, unit: 's', digits: 1, onInput: v => st.T = v });
  const F = ui.formula(ctx.controls, '');
  ui.legend(ctx.controls, [[C.anti, '水色の実線＝経路差 mλ の点'], [C.yellow, '黄の破線＝経路差 (m+½)λ の点']]);
  ui.slider(ctx.detail, { label: '明るさ', min: 0.5, max: 2.5, step: 0.1, value: 1, digits: 1, onInput: v => st.gain = v });
  note(ctx.detail, 'y(x,y,t) = A sin2π(t/T − r₁/λ) + A sin(2π(t/T − r₂/λ) + φ) を各点で計算して濃淡で表示。');

  cv.addHandle({ get: () => P, set: (x, y) => { P.x = x; P.y = y; }, color: C.yellow, label: 'P', r: 26, size: 8 });

  let off = null, offg = null, img = null, ow = 0, oh = 0;
  return {
    draw(t) {
      mark('interfere');
      cv.clear(); cv.setPad({ l: 34, r: 12, t: 12, b: 26 });
      const aspect = cv.iw / Math.max(1, cv.ih);
      const halfW = Math.max(4.2, 2.3 * aspect);
      cv.setViewIso(0, 0, halfW);
      const V = cv.view, lam = st.lam, T = st.T, d = st.d, phi = st.anti ? 0.5 : 0; // 回転数単位
      const S1 = { x: -d / 2, y: 0 }, S2 = { x: d / 2, y: 0 };
      const ph = t / T;

      // --- 濃淡（ImageData） ---
      const scale = Math.max(2, Math.ceil(Math.sqrt(cv.iw * cv.ih / 90000)));
      const W = Math.max(8, Math.round(cv.iw / scale)), H = Math.max(8, Math.round(cv.ih / scale));
      if (!off || W !== ow || H !== oh) {
        off = document.createElement('canvas'); off.width = W; off.height = H;
        offg = off.getContext('2d'); img = offg.createImageData(W, H); ow = W; oh = H;
        const dd = img.data; for (let k = 0; k < W * H; k++) dd[4 * k + 3] = 255;
      }
      const dd = img.data, sx = (V.x1 - V.x0) / W, sy = (V.y1 - V.y0) / H, gain = st.gain;
      for (let j = 0; j < H; j++) {
        const wy = V.y1 - (j + 0.5) * sy, dy1 = wy - S1.y, dy2 = wy - S2.y;
        const q1 = dy1 * dy1, q2 = dy2 * dy2;
        for (let i2 = 0; i2 < W; i2++) {
          const wx = V.x0 + (i2 + 0.5) * sx;
          const a = wx - S1.x, b = wx - S2.x;
          const r1 = Math.sqrt(a * a + q1), r2 = Math.sqrt(b * b + q2);
          let v = (sinT(ph - r1 / lam) + sinT(ph - r2 / lam + phi)) * 0.5 * gain;
          if (v > 1) v = 1; else if (v < -1) v = -1;
          const m = Math.pow(Math.abs(v), PROJ ? 1.1 : 1.25), o = 4 * (j * W + i2);
          if (PROJ) putShade(dd, o, v >= 0 ? m : -m);
          else if (v >= 0) { dd[o] = 84 * m; dd[o + 1] = 255 * m; dd[o + 2] = 138 * m; }
          else { dd[o] = 60 * m; dd[o + 1] = 130 * m; dd[o + 2] = 255 * m; }
        }
      }
      offg.putImageData(img, 0, 0);
      const g = cv.ctx; g.save(); g.imageSmoothingEnabled = true;
      g.drawImage(off, cv.pad.l, cv.pad.t, cv.iw, cv.ih); g.restore();
      cv.axes({ xLabel: 'x [m]', yLabel: 'y [m]', grid: false, xAxis: false, yAxis: false });

      // --- 教科書の作図（同心円） ---
      if (st.circles) {
        const rmax = Math.hypot(V.x1 - V.x0, V.y1 - V.y0);
        const base1 = lam * (ph - Math.floor(ph) + 0.75);
        const base2 = lam * (ph - Math.floor(ph) + 0.75 + phi);
        for (const [S, base] of [[S1, base1], [S2, base2]]) {
          for (let n = -2; n * lam + base < rmax; n++) {
            const rc = base + n * lam; if (rc <= 0.02) continue;
            cv.circle(S.x, S.y, rc, { color: hexA(C.text, .9), width: 1.6 });
            const rt = rc + lam / 2; if (rt < rmax) cv.circle(S.x, S.y, rt, { color: hexA(C.text, PROJ ? .75 : .55), width: 1.4, dash: [6, 5] });
          }
        }
      }

      // --- 強め合い・弱め合いの双曲線 ---
      if (st.lines) {
        const c = d / 2, ymax = V.y1 * 1.15, xmax = V.x1 * 1.15;
        const drawHyp = (k, o) => {
          const a = k / 2; if (a >= c - 1e-4) { if (Math.abs(k) < 1e-9) { cv.line(0, V.y0, 0, V.y1, o); } return; }
          const b = Math.sqrt(c * c - a * a);
          let umax = Math.asinh(ymax / b);
          if (a > 1e-6) umax = Math.min(umax, Math.acosh(Math.max(1, xmax / a)));
          if (!isFinite(umax) || umax <= 0) umax = 0.1;
          for (const s of [1, -1]) {
            const pts = [];
            for (let q = 0; q <= 60; q++) {
              const uu = -umax + 2 * umax * q / 60;
              pts.push([s * a * Math.cosh(uu), b * Math.sinh(uu)]);
            }
            cv.plotPts(pts, o);
            if (a < 1e-6) break; // m=0 は1本（x=0）
          }
        };
        const M = Math.floor(d / lam) + 1;
        // 大きく動く線＝水色の実線／ほとんど動かない線＝黄の破線（定在波タブの腹・節と同じ意味に揃える）
        const optCon = { color: C.anti, width: 2.4, alpha: .95 };
        const optDes = { color: C.yellow, width: 2, alpha: .95, dash: [8, 6] };
        for (let m = 0; m <= M; m++) {
          const k1 = m * lam, k2 = (m + 0.5) * lam;
          if (k1 < d) drawHyp(k1, st.anti ? optDes : optCon);
          if (k2 < d) drawHyp(k2, st.anti ? optCon : optDes);
        }
      }

      // --- 波源・P ---
      cv.dot(S1.x, S1.y, 7, { color: C.wave2, stroke: PROJ ? '#fff' : '#000', width: 2 });
      cv.dot(S2.x, S2.y, 7, { color: C.wave2, stroke: PROJ ? '#fff' : '#000', width: 2 });
      cv.text('S₁', S1.x, S1.y, { dy: -18 * SC, color: C.wave2, bold: true, size: 15 });
      cv.text('S₂', S2.x, S2.y, { dy: -18 * SC, color: C.wave2, bold: true, size: 15 });
      cv.hbracket(S1.x, S2.x, V.y0 + (V.y1 - V.y0) * 0.09, 'd = ' + fmt(d, 1) + ' m', { below: true });
      // S₁P・S₂P は作図補助線（灰）— 黄・水色は干渉の線の色なので使わない
      cv.line(S1.x, S1.y, P.x, P.y, { color: GA(.8, .95), width: 1.4, dash: [5, 5] });
      cv.line(S2.x, S2.y, P.x, P.y, { color: GA(.8, .95), width: 1.4, dash: [5, 5] });
      cv.drawHandles();

      // --- 読み出し ---
      DBG.P = P; DBG.st = st;
      DBG.toPage = (wx, wy) => { const r = cv.el.getBoundingClientRect(); return { x: r.left + cv.px(wx), y: r.top + cv.py(wy) }; };
      const r1 = Math.hypot(P.x - S1.x, P.y - S1.y), r2 = Math.hypot(P.x - S2.x, P.y - S2.y);
      const dr = Math.abs(r1 - r2), q = dr / lam;
      F.set('S₁P = ' + fmt(r1, 2) + ' m　S₂P = ' + fmt(r2, 2) + ' m　'
        + '経路差 |S₁P−S₂P| = <b>' + fmt(dr, 2) + '</b> m = <b>' + fmt(q, 2) + ' λ</b>'
        + '　<em>（' + (st.anti ? '逆位相：S₂ は S₁ が山を出す瞬間に谷を出す' : '同位相：S₁ と S₂ は同時に山を出す')
        + '　λ = ' + fmt(lam, 2) + ' m　T = ' + fmt(T, 2) + ' s　v = λ/T = ' + fmt(lam / T, 2) + ' m/s）</em>');

      // --- 点 P の y-t グラフ（P の変位を時刻 t の関数として描く） ---
      const yP = tt => sinT(tt / T - r1 / lam) + sinT(tt / T - r2 / lam + phi);
